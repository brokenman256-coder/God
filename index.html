/* ============================== TOWN VIEW: BUILDINGS & LAYOUT ============================== */
const TOWN_VIEW_SIZE=640;
const BUILDING_TYPES={
  cave:{icon:'\u{1F573}\u{FE0F}',name:'Cave Dwelling'}, tent:{icon:'⛺',name:'Tent'}, house:{icon:'🏠',name:'House'},
  farm:{icon:'🌾',name:'Farm'}, temple:{icon:'🛕',name:'Temple'}, shrine:{icon:'🕯️',name:'Shrine'},
  well:{icon:'⛲',name:'Well'}, tower:{icon:'🏢',name:'Tower',tall:true}, jail:{icon:'🔒',name:'Jail'},
  hall:{icon:'🏛️',name:'Town Hall'}, hospital:{icon:'🏥',name:'Hospital'}, workshop:{icon:'🔨',name:'Workshop'},
  mine:{icon:'⛏️',name:'Mine'}, market:{icon:'🏪',name:'Market'}
};
const JOB_CAPACITY={farm:4,workshop:3,mine:3,market:2};
function buildingTypeForJob(job){ return {farmer:'farm',miner:'mine',artisan:'workshop',merchant:'market'}[job]; }
function hashStr(s){
  let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; }
  return (h>>>0)%1000/1000*Math.PI*2;
}
function seededTownRng(town){
  let h=0; for(let i=0;i<town.id.length;i++){ h=(h*31+town.id.charCodeAt(i))>>>0; }
  return mulberry32((h^town.foundedTick)>>>0);
}
function placeBuilding(town,type){
  town.buildings=town.buildings||[];
  const rng=town._layoutRng||(town._layoutRng=seededTownRng(town));
  const minDist=54;
  let best=null,bestD=-1;
  for(let attempt=0;attempt<40;attempt++){
    const x=40+rng()*(TOWN_VIEW_SIZE-80);
    const y=40+rng()*(TOWN_VIEW_SIZE-80);
    let minToExisting=town.buildings.length?Infinity:9999;
    for(const b of town.buildings){ const d=Math.hypot(b.x-x,b.y-y); if(d<minToExisting) minToExisting=d; }
    if(minToExisting>=minDist){ town.buildings.push({id:uid('bld'),type,x,y}); return; }
    if(minToExisting>bestD){ bestD=minToExisting; best={x,y}; }
  }
  if(best) town.buildings.push({id:uid('bld'),type,x:best.x,y:best.y});
}
function syncTownBuildings(town){
  town.buildings=town.buildings||[];
  const houseType=town.techStageIdx===0?'cave':(town.techStageIdx===1?'tent':'house');
  const desiredHouses=Math.max(1,Math.ceil(town.population/5));
  let houses=town.buildings.filter(b=>b.type==='house'||b.type==='tent'||b.type==='cave');
  while(houses.length<desiredHouses && town.buildings.length<60){
    placeBuilding(town,houseType);
    houses=town.buildings.filter(b=>b.type==='house'||b.type==='tent'||b.type==='cave');
  }
  const desiredFarms=Math.max(1,Math.ceil(town.population/15));
  let farms=town.buildings.filter(b=>b.type==='farm');
  while(farms.length<desiredFarms && farms.length<14){
    placeBuilding(town,'farm');
    farms=town.buildings.filter(b=>b.type==='farm');
  }
  if(!town.buildings.some(b=>b.type==='hall')) placeBuilding(town,'hall');
  if(!town.buildings.some(b=>b.type==='shrine')) placeBuilding(town,'shrine');
  if((town.worship>=30||town.creed) && !town.buildings.some(b=>b.type==='temple')) placeBuilding(town,'temple');
  if(activeDisease(town) && !town.buildings.some(b=>b.type==='hospital')) placeBuilding(town,'hospital');
  if(town.totalArrests>0 && !town.buildings.some(b=>b.type==='jail')) placeBuilding(town,'jail');
  if(town.population>=20){
    const desiredWells=Math.max(1,Math.ceil(town.population/60));
    let wells=town.buildings.filter(b=>b.type==='well');
    while(wells.length<desiredWells && wells.length<4){
      placeBuilding(town,'well');
      wells=town.buildings.filter(b=>b.type==='well');
    }
  }
  if(town.techStageIdx>=1){
    const desiredWorkshops=Math.max(1,Math.ceil(town.population/20));
    let workshops=town.buildings.filter(b=>b.type==='workshop');
    while(workshops.length<desiredWorkshops && workshops.length<6){
      placeBuilding(town,'workshop');
      workshops=town.buildings.filter(b=>b.type==='workshop');
    }
    if(town.population>=15 && !town.buildings.some(b=>b.type==='market')) placeBuilding(town,'market');
  }
  if(town.techStageIdx>=2){
    const desiredMines=Math.max(1,Math.ceil(town.population/25));
    let mines=town.buildings.filter(b=>b.type==='mine');
    while(mines.length<desiredMines && mines.length<5){
      placeBuilding(town,'mine');
      mines=town.buildings.filter(b=>b.type==='mine');
    }
  }
  if(town.techStageIdx>=6){
    const desiredTowers=Math.max(1,Math.ceil(town.population/80));
    let towers=town.buildings.filter(b=>b.type==='tower');
    while(towers.length<desiredTowers && towers.length<8){
      placeBuilding(town,'tower');
      towers=town.buildings.filter(b=>b.type==='tower');
    }
  }
}
function ensureHome(npc,town){
  const houses=town.buildings.filter(b=>b.type==='house'||b.type==='tent'||b.type==='cave');
  if(houses.length) npc.homeId=choice(houses).id;
}

/* ============================== ECONOMY: JOBS, PRODUCTION, WEALTH ============================== */
function countByJob(town,job){
  return town.npcIds.filter(id=>{const n=G.npcs[id]; return n&&n.alive&&n.job===job;}).length;
}
function jobSlotCount(town,buildingType){
  return town.buildings.filter(b=>b.type===buildingType).length*(JOB_CAPACITY[buildingType]||0);
}
function pickWorkplace(town,type){
  const opts=town.buildings.filter(b=>b.type===type);
  return opts.length?choice(opts).id:null;
}
function assignJobs(town){
  const adults=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive&&(n.status==='adult'||n.status==='elder')&&!isImprisoned(n));
  const order=[
    ['farmer',jobSlotCount(town,'farm')],
    ['miner',jobSlotCount(town,'mine')],
    ['artisan',jobSlotCount(town,'workshop')],
    ['merchant',jobSlotCount(town,'market')]
  ];
  for(const [job,slots] of order){
    let current=adults.filter(n=>n.job===job).length;
    if(current>=slots) continue;
    const candidates=adults.filter(n=>!n.job||n.job==='unemployed'||n.job==='laborer');
    for(const n of candidates){
      if(current>=slots) break;
      n.job=job;
      n.workplaceId=pickWorkplace(town,buildingTypeForJob(job));
      current++;
    }
  }
  for(const n of adults){ if(!n.job) n.job='laborer'; }
}
function giniCoefficient(values){
  const arr=values.filter(v=>v>=0).sort((a,b)=>a-b);
  const n=arr.length;
  if(n<2) return 0;
  const sum=arr.reduce((s,v)=>s+v,0);
  if(sum<=0) return 0;
  let cum=0;
  for(let i=0;i<n;i++) cum+=(i+1)*arr[i];
  return (2*cum)/(n*sum)-(n+1)/n;
}
function makeNpc(opts){
  const sex=opts.sex||(Math.random()<0.5?'m':'f');
  const techIdx=opts.techStageIdx??0;
  const believer=Math.random()>=(ATHEIST_CHANCE[techIdx]??0.3);
  let traits;
  if(opts.traits && opts.traits.length){
    traits=opts.traits.slice();
  } else {
    traits=[];
    const n1=choice(TRAIT_POOL); traits.push(n1);
    if(Math.random()<0.35){ let n2=choice(TRAIT_POOL); if(n2!==n1) traits.push(n2); }
    if(!believer){
      const pi=traits.indexOf('Pious');
      if(pi!==-1) traits[pi]=choice(TRAIT_POOL.filter(t=>t!=='Pious'));
    }
  }
  const curiosityBaseline=clamp(inheritedCuriosity(opts)+rand(-12,12)+(traits.includes('Curious')?18:0),3,97);
  const n={
    id:uid('n'), name:opts.name||choice(FIRST_NAMES), sex, age:opts.age??0, alive:true,
    townId:opts.townId, status:'infant', believer,
    hunger:20, mood:60, faith:believer?30:8, health:90,
    traits, talent:opts.talent??irand(10,40), crimeInclination:irand(5,20), karma:0,
    role:'commoner', notable:false, title:null, giftedAtBirth:false,
    relationship:{status:'single'}, parents:opts.parents||[], children:[],
    blessCount:0, curseCount:0, disease:false, birthTick:G.tickCount, lastBirthTick:0,
    appearance:opts.appearance||randomAppearance(townOf(opts.townId)), custom:!!opts.custom,
    job:'unemployed', workplaceId:null, wealth:irand(5,25),
    curiosityBaseline, curiosity:curiosityBaseline,
    frozen:false, grantedPowers:[]
  };
  updateLifeStage(n);
  return n;
}
function inheritedCuriosity(opts){
  if(opts.parents && opts.parents.length){
    const vals=opts.parents.map(id=>G.npcs[id]?.curiosityBaseline).filter(v=>v!=null);
    if(vals.length) return vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  return rand(25,55);
}
function fertility(n){
  if(n.sex!=='f'||!n.alive) return 0;
  if(n.age<15||n.age>45) return 0;
  if(n.age<20) return (n.age-15)/5*0.8;
  if(n.age<=32) return 1;
  return Math.max(0,1-(n.age-32)/13);
}
function personalFaithBaseline(n){
  let b=32;
  if(n.traits.includes('Pious')) b+=20;
  if(n.traits.includes('Cunning')) b-=8;
  if(n.traits.includes('Curious')) b-=5;
  if(n.traits.includes('Stubborn')) b+=6;
  return clamp(b,5,90);
}
function addNpcToTown(town,npc){
  npc.townId=town.id;
  G.npcs[npc.id]=npc;
  town.npcIds.push(npc.id);
  syncTownBuildings(town);
  ensureHome(npc,town);
  pruneTownRoster(town);
}
function pruneTownRoster(town){
  const CAP=32;
  if(town.npcIds.length<=CAP) return;
  const commoners=town.npcIds.filter(id=>{
    const n=G.npcs[id];
    return n && n.alive && !n.notable && n.status!=='infant' && n.relationship.status!=='married' && n.age>25;
  });
  if(commoners.length){
    const removeId=choice(commoners);
    town.npcIds=town.npcIds.filter(id=>id!==removeId);
  }
}
function updateLifeStage(n){
  if(n.age<13) n.status='infant';
  else if(n.age<18) n.status='child';
  else if(n.age<60) n.status='adult';
  else n.status='elder';
}
function townOf(id){return G.towns.find(t=>t.id===id);}
function townName(id){const t=townOf(id);return t?t.name:'the void';}
function livingTowns(){return G.towns.filter(t=>t.alive);}
function maxTechStage(){return G.towns.length?Math.max(...G.towns.map(t=>t.techStageIdx)):0;}
function atomicUnlocked(){return maxTechStage()>=ATOMIC_IDX;}

function findGoodTownSite(){
  const g=G.grid; const candidates=[];
  for(let y=1;y<g.h-1;y++)for(let x=1;x<g.w-1;x++){
    const t=g.tiles[idx(g,x,y)];
    if(t!==TILE.LAND && t!==TILE.FOREST) continue;
    let nearWater=false;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      if(inBounds(g,x+dx,y+dy) && g.tiles[idx(g,x+dx,y+dy)]===TILE.WATER) nearWater=true;
    }
    if(nearWater) candidates.push({x,y});
  }
  if(!candidates.length){
    for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){
      const t=g.tiles[idx(g,x,y)];
      if(t===TILE.LAND||t===TILE.FOREST) candidates.push({x,y});
    }
  }
  return candidates.length?choice(candidates):{x:Math.floor(g.w/2),y:Math.floor(g.h/2)};
}
function usedTownNames(){return new Set(G.towns.map(t=>t.name));}
function randomTownName(){
  const used=usedTownNames();
  const options=TOWN_NAMES.filter(n=>!used.has(n));
  return options.length?choice(options):choice(TOWN_NAMES)+' '+irand(2,99);
}

function spawnFirstHumans(){
  const site=findGoodTownSite();
  const town=createTown(site.x,site.y,randomTownName());
  town.population=8;
  for(let i=0;i<8;i++) addNpcToTown(town,makeNpc({age:16+Math.random()*22,townId:town.id,techStageIdx:town.techStageIdx}));
  G.towns.push(town);
  log(`At ${town.name}, the first humans awaken and gaze upon the world you made.`,'milestone');
  markDirty('towns');
}

/* ============================== CHRONICLE / TOAST ============================== */
function log(text,cat,opts){
  opts=opts||{};
  G.chronicle.push({tick:G.tickCount,text,cat:cat||'general'});
  if(G.chronicle.length>300) G.chronicle.splice(0,G.chronicle.length-300);
  if(!opts.silent) appendChronicleDOM(text,cat);
}
let chronAutoScroll=true;
function appendChronicleDOM(text,cat){
  const el=document.getElementById('chronLog');
  if(!el) return;
  const div=document.createElement('div');
  div.className='cat-'+(cat||'general');
  div.innerHTML=`<span class="tag">D${G.tickCount}</span>${esc(text)}`;
  el.appendChild(div);
  while(el.children.length>140) el.removeChild(el.firstChild);
  if(chronAutoScroll) el.scrollTop=el.scrollHeight;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ============================== SIMULATION ============================== */
function markDirty(k){G.dirty[k]=true;}

function simulateTick(){
  G.tickCount++;
  if(G.evolutionStage>=1 && G.evolutionStage<6) stepEvolutionPassive();
  for(const town of G.towns) if(town.alive) stepTown(town);
  stepDemons();
  maybeGeneratePrayer();
  expireOldPrayers();
  regenFavor();
  maybeFoundColony();
  maybeSendCaravan();
  stepCaravans();
  decayOverlays();
  checkEraAdvance();
  if(G.tickCount%20===0) stepCultureDiffusion();
  if(G.tickCount%15===0) markDirty('towns');
}
/* Neighboring, non-warring countries slowly rub off on each other -- a
   cuisine, an art style, or a festival can spread from one to another,
   independent of the (unchanging) language each keeps as its own identity. */
function stepCultureDiffusion(){
  const towns=livingTowns();
  for(const town of towns){
    if(!town.culture||Math.random()>0.02) continue;
    const neighbors=towns.filter(o=>o.id!==town.id&&!town.atWarWith.includes(o.id)&&o.culture&&
      Math.hypot(o.x-town.x,o.y-town.y)<=18);
    if(!neighbors.length) continue;
    const donor=choice(neighbors);
    const trait=choice(['cuisine','art','festival']);
    if(town.culture[trait]!==donor.culture[trait]){
      town.culture[trait]=donor.culture[trait];
      log(`${town.name} begins adopting ${donor.name}'s tradition of ${donor.culture[trait]}.`,'general',{silent:true});
      markDirty('towns');
    }
  }
}

let FAST_FORWARDING=false;
function stepEvolutionPassive(){
  G.evolutionPoints+=0.15*(1+G.evolutionStage*0.12);
  const need=100;
  if(G.evolutionPoints>=need){
    G.evolutionPoints=need;
    if(!FAST_FORWARDING && !G._mutationModalOpen) showMutationChoice();
  }
  markDirty('specimen');
}

function regenFavor(){
  const worshipTotal=livingTowns().reduce((s,t)=>s+t.worship,0);
  const gain=0.04+worshipTotal*0.0012;
  G.favor=clamp(G.favor+gain,0,G.favorCap);
  markDirty('header');
}

function decayOverlays(){
  const g=G.grid;
  for(let i=0;i<g.overlay.length;i++){
    const o=g.overlay[i];
    if(o && G.tickCount>=o.until){
      if(o.type==='lava') g.tiles[i]=TILE.ASH;
      g.overlay[i]=null;
    }
  }
}

function stepTown(town){
  if(!town.culture) town.culture=generateCulture();
  syncTownBuildings(town);
  assignJobs(town);

  const matCap=town.materialsCap+town.techStageIdx*60;
  const goodsCap=town.goodsCap+town.techStageIdx*40;
  const farmerCount=countByJob(town,'farmer');
  const baseFoodProd=(2.2+town.techStageIdx*0.35)*town.population;
  const farmerRatio=town.population>0?farmerCount/town.population:0;
  const farmerBonus=1+farmerRatio*1.5;
  const foodProd=baseFoodProd*farmerBonus*weatherFoodMult(town);
  const foodCons=town.population*2.0;
  town.food=clamp(town.food+foodProd-foodCons,0,town.foodCap+town.techStageIdx*80);
  const hungry=town.food<=0;

  const minerCount=countByJob(town,'miner');
  const materialsProd=minerCount*(4+town.techStageIdx*1.2);
  town.materials=clamp(town.materials+materialsProd-town.population*0.08,0,matCap);

  const artisanCount=countByJob(town,'artisan');
  const goodsProduced=Math.min(artisanCount*(3+town.techStageIdx*0.8),town.materials);
  town.materials=clamp(town.materials-goodsProduced,0,matCap);
  town.goods=clamp(town.goods+goodsProduced-town.population*0.05,0,goodsCap);

  const merchantCount=countByJob(town,'merchant');
  const goodsSold=Math.min(merchantCount*3,town.goods);
  town.goods=clamp(town.goods-goodsSold,0,goodsCap);
  town.gold=clamp(town.gold+goodsSold*2,0,999999);

  for(const id of town.npcIds.slice()){
    const n=G.npcs[id];
    if(!n||!n.alive) continue;
    stepNpc(n,town,hungry);
  }

  /* Population dynamics: named/tracked citizens already changed town.population
     by +/-1 as they were individually born (maybeHaveChild) or died (killNpc).
     The much larger untracked crowd is modeled with the same real-world
     demographic levers -- a crude death rate derived from tech-era life
     expectancy (Gompertz-consistent) and a crude birth rate that falls with
     tech/secularization exactly like history's demographic transition. */
  const trackedAlive=town.npcIds.length;
  const untracked=Math.max(0,town.population-trackedAlive);
  const le=LIFE_EXPECTANCY[town.techStageIdx];
  const foodStressFactor=hungry?1.8:(town.food>town.foodCap*0.5?0.85:1);
  const diseaseFactor=activeDisease(town)?1.6:1;
  const warDeathFactor=town.atWarWith.length?1.3:1;
  const crowding=crowdingFactor(town.population);
  const dailyDeathRate=(1/le/365)*foodStressFactor*diseaseFactor*warDeathFactor*crowding;
  const untrackedDeaths=untracked*dailyDeathRate;

  const dailyBirthRate=(0.028*BIRTH_RATE_MULT[town.techStageIdx])/365;
  const foodBirthFactor=town.food>town.foodCap*0.3?1:0.5;
  const untrackedBirths=untracked*dailyBirthRate*foodBirthFactor*(1-town.unrest/300)*homeostasisFactor(town.population);

  town.population=Math.max(0,Math.round(trackedAlive+untracked+(untrackedBirths-untrackedDeaths)));
  if(town.population<=0){ town.alive=false; log(`${town.name} has fallen silent, its people gone.`,'death'); }

  const wealthValues=town.npcIds.map(id=>G.npcs[id]?.wealth).filter(v=>v!=null);
  town.gini=wealthValues.length>=2?giniCoefficient(wealthValues):0.3;
  const gov=GOVERNMENT_TYPES[town.government.type];
  const inequality=clamp(town.gini+gov.corruption*0.15,0,1);
  const crimeTarget=clamp(town.unrest*0.4+(hungry?28:0)+inequality*22-town.policeStrength*0.35,0,100);
  town.crimeRate=lerp(town.crimeRate,crimeTarget,0.06);
  town.unrest=clamp(town.unrest+(town.crimeRate>60?0.3:-0.2)+(activeDisease(town)?0.15:0)+(town.atWarWith.length?0.25:0)-gov.unrestDecay*0.4,0,100);
  const policeBase=4+town.techStageIdx*0.6-gov.corruption*3;
  const guardBoost = G.tickCount<town.guardBoostUntil?18:0;
  town.policeStrength=clamp(lerp(town.policeStrength,policeBase+guardBoost,0.08),0,100);

  const hasInventor=town.notableIds.some(id=>G.npcs[id]?.role==='inventor'&&G.npcs[id]?.alive);
  const inventorBonus=hasInventor?1.6:1;
  const curiosityBonus=1+(townAvgCuriosity(town)/100)*0.5;
  town.techProgress+=town.population*0.0032*inventorBonus*curiosityBonus*(1-town.unrest/220);
  const need=techNeed(town.techStageIdx);
  if(town.techProgress>=need && town.techStageIdx<TECH_STAGES.length-1){
    town.techStageIdx++; town.techProgress=0;
    log(`${town.name} advances into the ${TECH_STAGES[town.techStageIdx]}.`,'tech');
    for(const id of town.npcIds){ const n=G.npcs[id]; if(n&&n.alive) n.curiosity=clamp(n.curiosity+8,0,100); }
    markDirty('towns');
  }

  stepDisease(town);
  stepDiplomacy(town);
  stepWorship(town);
  stepGovernment(town);
}

function stepGovernment(town){
  const gov=GOVERNMENT_TYPES[town.government.type];
  town.gold=clamp(town.gold+town.population*gov.taxRate*0.08-town.population*0.01,0,999999);
  town.government.stability=clamp(town.government.stability+(town.unrest>70?-0.6:0.3)+(town.atWarWith.length?-0.3:0),0,100);

  if(town.government.leaderId && !(G.npcs[town.government.leaderId]&&G.npcs[town.government.leaderId].alive)){
    town.government.leaderId=null;
  }
  if(!town.government.leaderId){
    const candidate=town.notableIds.map(id=>G.npcs[id]).find(n=>n&&n.alive&&n.role==='leader');
    if(candidate) town.government.leaderId=candidate.id;
  }

  if(town.government.stability<20 && Math.random()<0.01){
    attemptRevolution(town);
  } else if(town.government.stability>70 && town.techStageIdx>=1 && Math.random()<0.0015){
    const opts=eligibleGovernments(town).filter(g=>g!==town.government.type);
    if(opts.length){
      const newType=choice(opts);
      const oldName=GOVERNMENT_TYPES[town.government.type].name;
      town.government.type=newType; town.government.since=G.tickCount; town.government.stability=60;
      log(`${town.name} peacefully transitions from ${art(oldName)} to ${art(GOVERNMENT_TYPES[newType].name)}.`,'milestone');
      markDirty('towns');
    }
  }
}
function attemptRevolution(town){
  const rebels=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive&&n.status==='adult'&&n.traits.includes('Ambitious'));
  const leaderName=town.government.leaderId&&G.npcs[town.government.leaderId]?G.npcs[town.government.leaderId].name:'the ruling order';
  if(!rebels.length){ town.unrest=clamp(town.unrest-10,0,100); return; }
  const newLeader=choice(rebels);
  const oldGovName=GOVERNMENT_TYPES[town.government.type].name;
  const opts=eligibleGovernments(town);
  const newType=choice(opts);
  town.government.type=newType;
  town.government.leaderId=newLeader.id;
  town.government.stability=45;
  town.government.since=G.tickCount;
  town.unrest=clamp(town.unrest-30,0,100);
  if(town.messiahId && town.messiahId!==newLeader.id){ /* messiah keeps their own title, leadership is separate */ }
  if(!newLeader.notable){ newLeader.notable=true; town.notableIds.push(newLeader.id); }
  newLeader.role='leader'; newLeader.title='Leader';
  newLeader.karma+=3;
  log(`Revolution! ${newLeader.name} overthrows ${leaderName} in ${town.name} — the ${oldGovName} falls to ${art(GOVERNMENT_TYPES[newType].name)}.`,'milestone');
  markDirty('towns');
}

function weatherFoodMult(town){
  const g=G.grid; const o=g.overlay[idx(g,town.x,town.y)];
  const hasWell=town.buildings&&town.buildings.some(b=>b.type==='well');
  if(!o) return 1;
  if(o.type==='rain') return 1.35;
  if(o.type==='drought') return hasWell?0.78:0.55;
  if(o.type==='flood') return 0.4;
  if(o.type==='radiation') return 0.2;
  return 1;
}
function activeDisease(town){return town.diseases.some(d=>!d.cured);}
function townAvgCuriosity(town){
  const vals=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive).map(n=>n.curiosity);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:35;
}

function moodDelta(n,town){
  let d=0;
  d+= n.hunger>70?-0.4:0.1;
  d+= n.faith>50?0.05:-0.05;
  d+= town.unrest>60?-0.2:0;
  d+= town.atWarWith.length?-0.15:0;
  d+= activeDisease(town)?-0.15:0;
  d+= rand(-0.3,0.3);
  return d;
}

function stepNpc(n,town,hungry){
  if(n.frozen) return;
  if(n.grantedPowers&&n.grantedPowers.length&&(n.status==='adult'||n.status==='elder')) maybeChannelGrantedPower(n,town);
  n.age+=1/365;
  updateLifeStage(n);
  n.hunger=clamp(n.hunger+(hungry?2.4:-1.6)+rand(-0.4,0.4),0,100);
  n.mood=clamp(n.mood+moodDelta(n,town),0,100);
  n.curiosity=clamp(n.curiosity+(n.curiosityBaseline-n.curiosity)*0.01+rand(-0.5,0.5),0,100);
  if(n.believer){
    const baseline=personalFaithBaseline(n);
    const worldPull=(town.worship-baseline)*0.15;
    n.faith=clamp(n.faith+(baseline+worldPull-n.faith)*0.01+rand(-0.4,0.4),0,100);
    if(n.faith<8 && Math.random()<0.0004){ n.believer=false; log(`${n.name} loses their faith and turns to reason.`,'general',{silent:true}); }
  } else {
    n.faith=clamp(n.faith+(8-n.faith)*0.01+rand(-0.2,0.2),0,100);
    if(n.faith>70 && Math.random()<0.0015){ n.believer=true; log(`${n.name} finds faith in ${townOf(n.townId)?.creed?.name||'the divine'}.`,'general',{silent:true}); }
  }
  n.health=clamp(n.health+(n.hunger>85?-0.6:0.15)+(n.disease?-0.5:0)+rand(-0.2,0.2),0,100);

  if((n.status==='adult'||n.status==='elder')&&!isImprisoned(n)){
    const wealthIncome={farmer:0.02,miner:0.03,artisan:0.05,merchant:0.08,laborer:0.015,unemployed:-0.02}[n.job]??0;
    n.wealth=clamp(n.wealth+wealthIncome*(1+n.talent/200)+(n.notable?0.05:0)+rand(-0.02,0.02),0,999);
  }
  if(n.status==='adult'){
    if(!isImprisoned(n)) updateCrime(n,town);
    updateRelationship(n,town);
    maybeBecomeNotable(n,town);
  }
  maybeDie(n,town);
}

function updateCrime(n,town){
  const frustratedAmbition=(n.traits.includes('Ambitious')&&!n.notable)?0.05:0;
  n.crimeInclination=clamp(n.crimeInclination+(n.hunger>70?0.3:-0.2)+(n.faith<30?0.1:-0.06)+(town.unrest>50?0.2:-0.1)+frustratedAmbition,0,100);
  if(Math.random()<n.crimeInclination/100*0.012) commitCrime(n,town);
}
const CRIME_SEVERITIES={
  minor:{label:'petty theft',fine:[8,20],prisonDays:[8,18],prisonChance:0.35},
  moderate:{label:'assault',fine:[20,45],prisonDays:[18,40],prisonChance:0.65},
  serious:{label:'grand theft',fine:[45,90],prisonDays:[40,90],prisonChance:0.85}
};
function rollCrimeSeverity(n){
  const heat=n.crimeInclination/100;
  const r=Math.random();
  if(r<0.55-heat*0.25) return 'minor';
  if(r<0.88-heat*0.15) return 'moderate';
  return 'serious';
}
function commitCrime(n,town){
  town.unrest=clamp(town.unrest+2,0,100);
  n.karma-=5;
  const caught=Math.random()*100<town.policeStrength;
  if(!caught){
    if(Math.random()<0.08) log(`Crime stirs unrest in ${town.name}.`,'crime');
    return;
  }
  arrestAndTry(n,town);
}
/* A real arrest -> trial -> sentence pipeline instead of a probabilistic
   catch-and-shrug: severity is rolled, a trial resolves guilty or acquitted,
   and a guilty verdict carries a real consequence -- a fine paid into the
   town's treasury, or actual prison time (n.prisonUntil) that pulls the
   convict out of the job pool and confines them to the jail in Town View
   until release. */
function arrestAndTry(n,town){
  town.totalArrests++;
  n.arrestCount=(n.arrestCount||0)+1;
  const severity=rollCrimeSeverity(n);
  const def=CRIME_SEVERITIES[severity];
  const gov=GOVERNMENT_TYPES[town.government.type];
  const convictionChance=clamp(0.55+town.policeStrength/400-gov.corruption*0.15,0.25,0.95);
  const convicted=Math.random()<convictionChance;
  if(!convicted){
    n.crimeInclination=clamp(n.crimeInclination-10,0,100);
    if(Math.random()<0.2) log(`${n.name} stands trial for ${def.label} in ${town.name} and is acquitted.`,'crime');
    return;
  }
  town.totalConvictions++;
  n.convictionCount=(n.convictionCount||0)+1;
  n.karma-=4; n.crimeInclination=clamp(n.crimeInclination-25,0,100);
  const toPrison=Math.random()<def.prisonChance;
  if(toPrison){
    const days=irand(def.prisonDays[0],def.prisonDays[1]);
    n.prisonUntil=G.tickCount+days;
    log(`${n.name} is convicted of ${def.label} in ${town.name} and sentenced to ${days} days in jail.`,'crime');
  } else {
    const fine=irand(def.fine[0],def.fine[1]);
    const paid=Math.min(n.wealth,fine);
    n.wealth=clamp(n.wealth-paid,0,999);
    town.gold=clamp(town.gold+paid,0,999999);
    n.health=clamp(n.health-6,0,100);
    log(`${n.name} is convicted of ${def.label} in ${town.name} and fined ${paid} gold.`,'crime');
  }
  markDirty('towns');
}
function isImprisoned(n){ return n.prisonUntil && n.prisonUntil>G.tickCount; }

function findEligiblePartner(n,town){
  const cands=town.npcIds.filter(id=>{
    const p=G.npcs[id];
    return p && p.alive && p.id!==n.id && p.status==='adult' && p.relationship.status==='single';
  });
  return cands.length?G.npcs[choice(cands)]:null;
}
function updateRelationship(n,town){
  const r=n.relationship;
  if(r.status==='single'){
    if(Math.random()<0.01){
      const p=findEligiblePartner(n,town);
      if(p){
        n.relationship={status:'courting',partnerId:p.id,progress:0};
        p.relationship={status:'courting',partnerId:n.id,progress:0};
      }
    }
  } else if(r.status==='courting'){
    const p=G.npcs[r.partnerId];
    if(!p||!p.alive){ n.relationship={status:'single'}; return; }
    r.progress=(r.progress||0)+rand(1,4);
    if(r.progress>=100){ marry(n,p,town); }
    else if(Math.random()<0.025){ n.relationship={status:'single'}; p.relationship={status:'single'}; }
  } else if(r.status==='married'){
    const p=G.npcs[r.partnerId];
    if(p && p.alive && n.id<p.id && town.food>town.foodCap*0.05){
      const fert=Math.max(fertility(n),fertility(p));
      const spacingOk=(G.tickCount-(n.lastBirthTick||0))>650 && (G.tickCount-(p.lastBirthTick||0))>650;
      const familyCap=MAX_FAMILY_SIZE[town.techStageIdx];
      if(fert>0 && spacingOk && n.children.length<familyCap){
        const chance=0.006*fert*BIRTH_RATE_MULT[town.techStageIdx]*(town.food>town.foodCap*0.3?1:0.4)*homeostasisFactor(town.population)-town.unrest/8000;
        if(Math.random()<Math.max(0,chance)) maybeHaveChild(n,p,town);
      }
    }
  }
}
function marry(n,p,town){
  n.relationship={status:'married',partnerId:p.id,progress:100};
  p.relationship={status:'married',partnerId:n.id,progress:100};
  n.karma+=2; p.karma+=2;
  log(`${n.name} and ${p.name} are wed in ${town.name}.`,'family');
  town.worship=clamp(town.worship+1,0,100);
  markDirty('towns');
}
function maybeHaveChild(n,p,town){
  const child=makeNpc({age:0,townId:town.id,parents:[n.id,p.id],techStageIdx:town.techStageIdx});
  addNpcToTown(town,child);
  n.children.push(child.id); p.children.push(child.id);
  n.lastBirthTick=G.tickCount; p.lastBirthTick=G.tickCount;
  town.population++;
  G.stats.totalBirths++;
  log(`A child is born to ${n.name} and ${p.name} in ${town.name}.`,'family');
  markDirty('towns');
}

function maybeBecomeNotable(n,town){
  if(n.notable||n.age<16) return;
  const giftMult=n.giftedAtBirth?3.2:1;
  const ambitionMult=n.traits.includes('Ambitious')?1.8:1;
  const curiosityMult=1+(n.curiosity/100)*0.6;
  const chance=(n.talent/100)*0.0007*giftMult*ambitionMult*curiosityMult;
  if(Math.random()<chance){
    const roles=['leader','inventor','healer','priest'];
    const avail=roles.filter(r=>!town.notableIds.some(id=>{const t=G.npcs[id];return t&&t.alive&&t.role===r;}));
    if(!avail.length) return;
    let role;
    if(n.traits.includes('Ambitious')&&avail.includes('leader')&&Math.random()<0.5) role='leader';
    else if(n.curiosity>65&&avail.includes('inventor')&&Math.random()<0.55) role='inventor';
    else role=choice(avail);
    n.notable=true; n.role=role; n.title=titleFor(role);
    town.notableIds.push(n.id);
    if(role==='leader' && !town.government.leaderId) town.government.leaderId=n.id;
    log(`${n.name} of ${town.name} has risen as ${art(n.title)}!`,'notable');
    markDirty('towns');
  }
}
function titleFor(role){
  return {leader:'Leader',inventor:'Inventor',healer:'Healer',priest:'Priest',messiah:'Messiah'}[role]||'Notable';
}

function maybeDie(n,town){
  let p=0;
  if(n.age<5){
    p+=INFANT_MORTALITY[town.techStageIdx]??0.0003;
  } else {
    const le=LIFE_EXPECTANCY[town.techStageIdx];
    p+=0.000012*Math.exp(0.09*(n.age-le*0.55));
  }
  if(n.hunger>90) p+=0.0022;
  else if(n.hunger>75) p+=0.0006;
  if(n.health<20) p+=0.003;
  else if(n.health<40) p+=0.0008;
  if(n.disease) p+=0.004;
  if(town.atWarWith.length && Math.random()<0.15) p+=0.0018;
  if(town.population>POP_CAP) p+=0.0004*((town.population-POP_CAP)/POP_CAP);
  if(n.traits.includes('Sickly')) p*=1.3;
  if(n.traits.includes('Strong')) p*=0.85;
  p=clamp(p,0,0.95);
  if(Math.random()<p){
    let cause='old age';
    if(n.age<5) cause='infancy';
    else if(n.hunger>90) cause='starvation';
    else if(n.disease) cause='sickness';
    else if(town.atWarWith.length && Math.random()<0.3) cause='war';
    killNpc(n,town,cause);
  }
}
function killNpc(n,town,cause){
  n.alive=false; n.deathTick=G.tickCount; n.deathCause=cause;
  town.npcIds=town.npcIds.filter(id=>id!==n.id);
  town.population=Math.max(0,town.population-1);
  if(n.notable){
    town.notableIds=town.notableIds.filter(id=>id!==n.id);
    if(town.messiahId===n.id) town.messiahId=null;
    if(town.government.leaderId===n.id) town.government.leaderId=null;
    log(`${n.name}, ${art(n.title||'notable figure')} of ${town.name}, has died of ${cause}.`,'death');
  }
  const r=n.relationship;
  if(r && r.partnerId){
    const p=G.npcs[r.partnerId];
    if(p && p.alive) p.relationship={status:'single'};
  }
  G.stats.totalDeaths++;
  const dest=judgeSoul(n);
  markDirty('towns');
}
function judgeSoul(n){
  let karma=n.karma+(n.faith-50)*0.2+(n.blessCount*4)-(n.curseCount*4);
  const dest= karma>25?'heaven': karma<-25?'hell':'limbo';
  G.souls[dest].push({id:uid('soul'),name:n.name,townName:townName(n.townId),
    deathTick:G.tickCount,karma:Math.round(karma),cause:n.deathCause||'unknown',raised:false});
  return dest;
}

function stepDisease(town){
  for(const d of town.diseases){
    if(d.cured) continue;
    d.infected=clamp(d.infected+town.population*0.012,0,town.population);
    town.population=Math.max(0,town.population-Math.round(d.infected*0.0022*d.severity));
    for(const id of town.npcIds){ const n=G.npcs[id]; if(n&&n.alive&&!n.disease&&Math.random()<0.01) n.disease=true; }
    const healerBonus=town.notableIds.some(id=>{const h=G.npcs[id];return h&&h.alive&&h.role==='healer';})?1.6:1;
    d.cureProgress=clamp(d.cureProgress+(0.06+town.techStageIdx*0.035)*healerBonus,0,100);
    if(d.cureProgress>=100){
      d.cured=true;
      for(const id of town.npcIds){ const n=G.npcs[id]; if(n) n.disease=false; }
      log(`${town.name} has found a cure for the ${d.name}!`,'disease');
      markDirty('towns');
    }
  }
}

function stepDiplomacy(town){
  for(const other of livingTowns()){
    if(other.id===town.id) continue;
    const dist=Math.hypot(town.x-other.x,town.y-other.y);
    if(dist>26) continue;
    const key=other.id;
    let t=town.tension[key]||0;
    const techGap=Math.abs(town.techStageIdx-other.techStageIdx);
    const warPropensity=GOVERNMENT_TYPES[town.government.type].warPropensity;
    t+= ((0.02*(30-dist)/30) + techGap*0.01 + Math.random()*0.03 - 0.015)*warPropensity;
    t=clamp(t,0,100);
    town.tension[key]=t;
    const atWar=town.atWarWith.includes(other.id);
    if(!atWar && t>78 && town.techStageIdx>=1 && other.techStageIdx>=1 && Math.random()<0.02){
      declareWar(town,other);
    } else if(atWar && (t<25 || Math.random()<0.01)){
      endWar(town,other,'exhaustion');
    }
  }
}
function declareWar(a,b){
  a.atWarWith.push(b.id); b.atWarWith.push(a.id);
  log(`War erupts between ${a.name} and ${b.name}!`,'disaster');
  markDirty('towns');
}
function endWar(a,b,reason){
  a.atWarWith=a.atWarWith.filter(id=>id!==b.id);
  b.atWarWith=b.atWarWith.filter(id=>id!==a.id);
  a.tension[b.id]=10; b.tension[a.id]=10;
  log(`Peace comes to ${a.name} and ${b.name} (${reason}).`,'family');
  markDirty('towns');
}

/* Original, fictional devotional lines -- not drawn from or imitating any
   real-world scripture or prayer -- that devout towns recite to the player-
   god, in keeping with the game's existing invented-creed system (Order of
   Rain, Cult of Ash, etc. are all fictional too). */
const CHANTS=[
  "Maker of sky, maker of stone, we are the seeds your hand has sown.",
  "One above all, hear our small voice -- in your shaping we rejoice.",
  "By your breath the rivers run, by your will is set the sun.",
  "We are clay, you are the hand; guide us gently through this land.",
  "Sky-shaper, sky-shaper, watch us grow, as you will it, so we go.",
  "No storm nor stone but bends to thee -- as you shape us, so shall we be.",
  "First light, last light, all light thine; keep our small flame close to shine.",
  "We plant, we build, we live, we die -- always beneath your watching sky.",
  "Maker above, maker unseen, we chant your name where none has been.",
  "As the seed trusts the rain to fall, we trust the hand behind it all."
];
function stepWorship(town){
  const npcs=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive);
  const believers=npcs.filter(n=>n.believer);
  town.secularism=npcs.length?1-(believers.length/npcs.length):town.secularism;
  const avgFaith=believers.length?believers.reduce((s,n)=>s+n.faith,0)/believers.length:0;
  const messiahBonus=town.messiahId?12:0;
  const shrineBonus=town.buildings&&town.buildings.some(b=>b.type==='shrine')?1.5:0;
  const target=avgFaith*(1-town.secularism*0.35)+messiahBonus+shrineBonus;
  town.worship=clamp(lerp(town.worship,target,0.03),0,100);
  if(town.worship>=50 && !town.creed){
    town.creed=generateCreed(town);
    log(`The people of ${town.name} have founded ${town.creed.name}.`,'milestone');
    markDirty('towns');
  }
  if(town.worship>=40 && Math.random()<0.0015){
    log(`The faithful of ${town.name} chant: "${choice(CHANTS)}"`,'general',{silent:true});
  }
}
function generateCreed(town){
  const hist=town.divineHistory;
  let topCat='general', topVal=0;
  for(const k in hist){ if(hist[k]>topVal){ topVal=hist[k]; topCat=k; } }
  const templates={
    weather:['The Order of Rain','Children of the Storm','The Fertile Sky'],
    disaster:['The Cult of Ash','Faith of the Shaking Earth','The Ember Covenant'],
    blessing:['The Chosen Circle','The Gilded Faith','Kin of the Light'],
    civilization:['The Guardian Creed','The Watchful Order'],
    general:['The Silent Faith','The First Believers','The Old Way']
  };
  const opts=templates[topCat]||templates.general;
  return {name:choice(opts),tenets:['We are shaped by the will above.']};
}
function recordDivine(town,cat){
  if(!town) return;
  town.divineHistory[cat]=(town.divineHistory[cat]||0)+1;
}

function stepDemons(){
  G.demons=G.demons.filter(d=>{
    const town=townOf(d.townId);
    if(town && town.alive && G.tickCount<d.until){
      town.unrest=clamp(town.unrest+0.5,0,100);
      if(Math.random()<0.02) town.population=Math.max(0,town.population-irand(1,3));
      return true;
    }
    return false;
  });
}

function maybeGeneratePrayer(){
  if(G.prayers.length>=8) return;
  const towns=livingTowns().filter(t=>t.npcIds.length>0 && Math.random()>t.secularism*0.7);
  if(!towns.length) return;
  if(Math.random()>0.06) return;
  const town=choice(towns);
  const curiousAdult=town.npcIds.map(id=>G.npcs[id]).find(n=>n&&n.alive&&n.status==='adult'&&n.curiosity>60);
  const needs=[];
  if(town.food<town.foodCap*0.3) needs.push('rain');
  if(activeDisease(town)) needs.push('health');
  if(town.atWarWith.length) needs.push('war');
  if(town.population<15) needs.push('fertility');
  if(curiousAdult) needs.push('wonder');
  needs.push('rain','fertility');
  const type=choice(needs);
  const texts={
    rain:[`The fields of ${town.name} thirst. They pray for rain.`,`Farmers of ${town.name} beg the sky to open.`],
    health:[`The sick of ${town.name} cry out for healing.`,`${town.name} prays for deliverance from illness.`],
    war:[`${town.name} prays for strength in battle.`,`The warriors of ${town.name} seek your favor in war.`],
    fertility:[`${town.name} prays for new life among its people.`,`The elders of ${town.name} pray for growth.`],
    wonder:[`${curiousAdult?.name} of ${town.name} wonders: why do the stars wander the night sky?`,
      `${curiousAdult?.name} asks: what lies beyond the edge of the world?`,
      `${curiousAdult?.name} seeks to understand why the seasons turn.`]
  };
  const prayer={id:uid('pr'),townId:town.id,type,text:choice(texts[type]),
    npcId:type==='wonder'?curiousAdult.id:null,
    createdAt:G.tickCount,expiresAt:G.tickCount+40};
  G.prayers.push(prayer);
  markDirty('prayers');
}
function expireOldPrayers(){
  const before=G.prayers.length;
  G.prayers=G.prayers.filter(p=>{
    if(G.tickCount>=p.expiresAt){
      const t=townOf(p.townId);
      if(t) t.worship=clamp(t.worship-1.5,0,100);
      return false;
    }
    return true;
  });
  if(G.prayers.length!==before) markDirty('prayers');
}
function answerPrayer(id){
  const p=G.prayers.find(x=>x.id===id); if(!p) return;
  const town=townOf(p.townId); if(!town){ G.prayers=G.prayers.filter(x=>x.id!==id); return; }
  const cost=6;
  if(G.favor<cost){ toast('Not enough favor.'); return; }
  G.favor-=cost;
  if(p.type==='rain'){ setOverlayRegion(town.x,town.y,4,'rain',10); }
  else if(p.type==='health'){ for(const d of town.diseases) if(!d.cured) d.cureProgress=clamp(d.cureProgress+18,0,100); }
  else if(p.type==='war'){ town.policeStrength=clamp(town.policeStrength+15,0,100); }
  else if(p.type==='fertility'){ town.food=clamp(town.food+60,0,town.foodCap); }
  else if(p.type==='wonder'){
    town.techProgress=clamp(town.techProgress+15,0,9999);
    const asker=p.npcId?G.npcs[p.npcId]:null;
    if(asker&&asker.alive) asker.curiosity=clamp(asker.curiosity+12,0,100);
    log(`Insight dawns on ${town.name} — your answer quickens their understanding.`,'general',{silent:true});
  }
  town.worship=clamp(town.worship+4,0,100);
  recordDivine(town,'weather');
  G.stats.totalPrayersAnswered++;
  log(`Your favor answers the prayers of ${town.name}.`,'milestone');
  G.prayers=G.prayers.filter(x=>x.id!==id);
  markDirty('prayers'); markDirty('header');
}
function denyPrayer(id){
  const p=G.prayers.find(x=>x.id===id); if(!p) return;
  const town=townOf(p.townId);
  if(town) town.worship=clamp(town.worship-3,0,100);
  G.stats.totalPrayersDenied++;
  G.prayers=G.prayers.filter(x=>x.id!==id);
  markDirty('prayers');
}

const MAX_TOWNS=50;
function maybeFoundColony(){
  if(G.towns.filter(t=>t.alive).length>=MAX_TOWNS) return;
  for(const town of livingTowns()){
    if(town.population>400 && Math.random()<0.003){
      const site=findGoodTownSite();
      const nt=createTown(site.x,site.y,randomTownName());
      nt.techStageIdx=Math.max(0,town.techStageIdx-1);
      town.population=Math.round(town.population*0.7);
      G.towns.push(nt);
      for(let i=0;i<6;i++) addNpcToTown(nt,makeNpc({age:16+Math.random()*20,townId:nt.id,techStageIdx:nt.techStageIdx}));
      const candidates=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive&&n.status==='adult'&&!n.notable&&(n.traits.includes('Ambitious')||n.curiosity>70));
      const founder=candidates.length?choice(candidates):null;
      if(founder){
        town.npcIds=town.npcIds.filter(id=>id!==founder.id);
        founder.townId=nt.id; nt.npcIds.push(founder.id);
        founder.notable=true; founder.role='leader'; founder.title='Leader';
        nt.notableIds.push(founder.id);
        nt.government.leaderId=founder.id;
        const drive=founder.traits.includes('Ambitious')?'ever ambitious':'restless with curiosity';
        log(`${founder.name}, ${drive}, leads settlers from ${town.name} to found ${nt.name}.`,'milestone');
      } else {
        log(`Settlers from ${town.name} found the town of ${nt.name}.`,'milestone');
      }
      markDirty('towns');
      return;
    }
  }
}

/* ============================== TRADE CARAVANS ============================== */
function maybeSendCaravan(){
  if(G.caravans.length>=6) return;
  if(Math.random()>0.02) return;
  const towns=livingTowns().filter(t=>t.techStageIdx>=1);
  if(towns.length<2) return;
  const from=choice(towns);
  const partners=towns.filter(t=>t.id!==from.id)
    .sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y));
  if(!partners.length) return;
  const to=partners[0];
  let resource=null,amount=0;
  if(from.goods>20){ resource='goods'; amount=Math.min(15,Math.floor(from.goods*0.3)); }
  else if(from.materials>30){ resource='materials'; amount=Math.min(20,Math.floor(from.materials*0.3)); }
  else if(from.food>from.foodCap*0.6){ resource='food'; amount=Math.min(30,Math.floor(from.food*0.2)); }
  if(!resource||amount<=0) return;
  from[resource]=Math.max(0,from[resource]-amount);
  G.caravans.push({id:uid('cv'),fromTownId:from.id,toTownId:to.id,resource,amount,startTick:G.tickCount,duration:14});
  markDirty('towns');
}
function stepCaravans(){
  G.caravans=G.caravans.filter(c=>{
    if(G.tickCount-c.startTick<c.duration) return true;
    const to=townOf(c.toTownId), from=townOf(c.fromTownId);
    if(to && to.alive){
      if(c.resource==='goods') to.goods=clamp(to.goods+c.amount,0,to.goodsCap+to.techStageIdx*40);
      else if(c.resource==='materials') to.materials=clamp(to.materials+c.amount,0,to.materialsCap+to.techStageIdx*60);
      else if(c.resource==='food') to.food=clamp(to.food+c.amount,0,to.foodCap+to.techStageIdx*80);
      const goldGain=Math.round(c.amount*1.5);
      to.gold=clamp(to.gold-Math.round(goldGain*0.3),0,999999);
      if(from && from.alive) from.gold=clamp(from.gold+goldGain,0,999999);
      log(`A trade caravan from ${from?from.name:'a distant land'} delivers ${c.amount} ${c.resource} to ${to.name}.`,'general',{silent:true});
    }
    return false;
  });
}

function checkEraAdvance(){
  let e=G.era;
  if(e<ERA.BARREN && G.genesisStep>=GENESIS_STEPS.length) e=ERA.BARREN;
  if(e===ERA.BARREN && G.evolutionStage>=1) e=ERA.PRIMORDIAL;
  if(e===ERA.PRIMORDIAL && G.evolutionStage>=4) e=ERA.EVOLUTION;
  if(e===ERA.EVOLUTION && G.evolutionStage>=6) e=ERA.DAWN;
  if(G.towns.some(t=>t.alive)){
    const mt=maxTechStage();
    const desired=TECH_TO_ERA[mt];
    if(desired>e) e=desired;
  }
  if(e>G.era){ G.era=e; markDirty('header'); markDirty('powers'); }
}

function autoAdvanceIfStuck(allowGenesis){
  if(allowGenesis && G.genesisStep<GENESIS_STEPS.length){
    doGenesisStep(G.genesisStep);
  } else if(G.era===ERA.BARREN && G.evolutionStage===0 && G.favor>=15){
    doSeedLife();
  } else if(G.evolutionStage>=1 && G.evolutionStage<6 && G.evolutionPoints>=100){
    const opts=MUTATION_CHOICES[G.evolutionStage];
    if(opts) applyMutation(choice(opts));
  } else if(G.evolutionStage>=6 && !G.towns.length){
    spawnFirstHumans();
  }
}

/* ============================== GENESIS / EVOLUTION ACTIONS ============================== */
function doGenesisStep(stepIdx){
  if(stepIdx!==G.genesisStep) return;
  const step=GENESIS_STEPS[stepIdx];
  if(step.id==='waters') doGenesisWaters(G.grid);
  else if(step.id==='land') doGenesisLand(G.grid);
  else if(step.id==='vegetation') doGenesisVegetation(G.grid);
  log(step.text,'milestone');
  G.genesisStep++;
  if(step.id==='finish'){ G.favor=clamp(G.favor+20,0,G.favorCap); }
  checkEraAdvance();
  markDirty('powers'); markDirty('header');
}
function doSeedLife(){
  if(G.era!==ERA.BARREN){ toast('The world must be barren and ready first.'); return; }
  if(G.favor<15){ toast('Not enough favor.'); return; }
  G.favor-=15;
  G.evolutionStage=1; G.evolutionPoints=0;
  log('In the deep, dark waters, the first living cell stirs into being.','milestone');
  checkEraAdvance();
  markDirty('specimen'); markDirty('powers'); markDirty('header');
}
function doQuickenEvolution(){
  if(G.evolutionStage<1||G.evolutionStage>=6){ toast('Not applicable right now.'); return; }
  if(G.favor<10){ toast('Not enough favor.'); return; }
  G.favor-=10; G.evolutionPoints=clamp(G.evolutionPoints+25,0,100);
  log('Life quickens under your will.','general',{silent:true});
  toast('Evolution quickened.');
  markDirty('specimen'); markDirty('header');
  if(G.evolutionPoints>=100 && !G._mutationModalOpen) showMutationChoice();
}
function doFreezeTime(){
  G.paused=!G.paused;
  log(G.paused?'Time itself grinds to a halt at your command.':'Time flows once more.','milestone');
  toast(G.paused?'Time is frozen.':'Time flows again.');
}
function applyMutation(opt){
  G.evolutionTraits.push(opt.name);
  G.evolutionStage++;
  G.evolutionPoints=0;
  log(`Evolution takes a leap: ${STAGE_NAMES[G.evolutionStage]} — the trait of ${opt.name} emerges.`,'milestone');
  if(G.evolutionStage===6) spawnFirstHumans();
  checkEraAdvance();
  markDirty('specimen'); markDirty('header');
}

/* ============================== TILE / TOWN POWER EFFECTS ============================== */
function setOverlayRegion(cx,cy,radius,type,duration){
  const g=G.grid;
  for(let dy=-radius;dy<=radius;dy++)for(let dx=-radius;dx<=radius;dx++){
    if(dx*dx+dy*dy>radius*radius) continue;
    const x=cx+dx,y=cy+dy;
    if(!inBounds(g,x,y)) continue;
    g.overlay[idx(g,x,y)]={type,until:G.tickCount+duration};
  }
}
function townsNear(cx,cy,radius){
  return livingTowns().filter(t=>Math.hypot(t.x-cx,t.y-cy)<=radius);
}
function damageTownsNear(cx,cy,radius,popLossFrac,unrestAdd){
  for(const t of townsNear(cx,cy,radius)){
    t.population=Math.max(0,Math.round(t.population*(1-popLossFrac)));
    t.food=Math.max(0,t.food*(1-popLossFrac));
    t.unrest=clamp(t.unrest+unrestAdd,0,100);
    if(t.population<=0){ t.alive=false; log(`${t.name} has been destroyed.`,'disaster'); }
  }
}

const GRANTABLE_POWERS=['rain','lightning','sendHealers'];
function maybeChannelGrantedPower(n,town){
  for(const powerId of n.grantedPowers){
    const power=POWER_BY_ID[powerId];
    if(!power) continue;
    if(Math.random()<0.0015){
      if(power.target==='tile') applyTilePower(power,town.x,town.y);
      else if(power.target==='town') applyTownPower(power,town);
      log(`${n.name}, chosen of ${power.name}, channels your gift over ${town.name}.`,'notable');
      markDirty('towns');
      return;
    }
  }
}
function applyTilePower(power,tx,ty){
  const g=G.grid;
  if(power.id==='rain'){ setOverlayRegion(tx,ty,4,'rain',10); log('Rain falls upon the land at your command.','general',{silent:true}); toast('Rain called.'); }
  else if(power.id==='drought'){ setOverlayRegion(tx,ty,4,'drought',14); log('A drought grips the land.','disaster',{silent:true}); toast('Drought spread.'); }
  else if(power.id==='lightning'){
    setOverlayRegion(tx,ty,1,'fire',5);
    log('Lightning splits the sky and strikes the earth.','disaster',{silent:true});
    toast('Lightning struck.');
  } else if(power.id==='earthquake'){
    setOverlayRegion(tx,ty,2,'quake',3);
    damageTownsNear(tx,ty,6,0.12,15);
    log('The ground shakes violently.','disaster');
  } else if(power.id==='flood'){
    setOverlayRegion(tx,ty,4,'flood',12);
    damageTownsNear(tx,ty,5,0.08,10);
    log('Rising waters flood the land.','disaster');
  } else if(power.id==='volcano'){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=tx+dx,y=ty+dy;
      if(inBounds(g,x,y)) g.tiles[idx(g,x,y)]=TILE.LAVA;
    }
    setOverlayRegion(tx,ty,1,'lava',40);
    setOverlayRegion(tx,ty,5,'ash',30);
    damageTownsNear(tx,ty,7,0.22,25);
    log('A volcano erupts, spewing fire and ash across the land.','disaster');
  } else if(power.id==='meteor'){
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=tx+dx,y=ty+dy;
      if(inBounds(g,x,y)) g.tiles[idx(g,x,y)]=TILE.ASH;
    }
    setOverlayRegion(tx,ty,6,'ash',25);
    damageTownsNear(tx,ty,9,0.3,30);
    log('A meteor crashes into the world with cataclysmic force.','disaster');
  }
  const near=townsNear(tx,ty,6)[0];
  recordDivine(near, power.cat==='Weather'?'weather':'disaster');
  markDirty('towns');
}
function applyTownPower(power,town){
  if(power.id==='plague'){
    town.diseases.push({name:choice(DISEASE_NAMES),infected:2,severity:rand(0.6,1.6),cureProgress:0,cured:false});
    log(`A plague breaks out in ${town.name}.`,'disease');
  } else if(power.id==='nuke'){
    if(!atomicUnlocked()){ toast('No settlement has reached the Atomic Age yet.'); return; }
    const g=G.grid;
    setOverlayRegion(town.x,town.y,6,'radiation',60);
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      const x=town.x+dx,y=town.y+dy;
      if(inBounds(g,x,y)) g.tiles[idx(g,x,y)]=TILE.ASH;
    }
    town.population=Math.round(town.population*0.15);
    town.unrest=100;
    for(const t of livingTowns()) t.unrest=clamp(t.unrest+8,0,100);
    if(town.population<=0){ town.alive=false; }
    log(`The sky burns. ${town.name} is consumed by a nuclear strike.`,'disaster');
  } else if(power.id==='sendGuards'){
    town.guardBoostUntil=G.tickCount+25;
    log(`Guards are dispatched to ${town.name}.`,'general',{silent:true});
    toast('Guards sent.');
  } else if(power.id==='sendHealers'){
    for(const d of town.diseases) if(!d.cured) d.cureProgress=clamp(d.cureProgress+22,0,100);
    log(`Healers rush to aid ${town.name}.`,'general',{silent:true});
    toast('Healers sent.');
  }
  recordDivine(town,power.cat==='Civilization'?'civilization':'disaster');
  markDirty('towns');
}
function applyTownPairPower(power,a,b){
  if(power.id==='forcePeace'){
    if(!a.atWarWith.includes(b.id)){ toast(`${a.name} and ${b.name} are not at war.`); return; }
    endWar(a,b,'divine decree');
  } else if(power.id==='forceWar'){
    if(a.atWarWith.includes(b.id)){ toast('Already at war.'); return; }
    declareWar(a,b);
  }
}
function applyNpcPower(power,n){
  const town=townOf(n.townId);
  if(power.id==='bless'){
    n.blessCount++; n.mood=clamp(n.mood+25,0,100); n.health=clamp(n.health+15,0,100);
    n.faith=clamp(n.faith+(n.believer?15:5),0,100); n.karma+=6;
    if(!n.believer && n.faith>60 && Math.random()<0.15){ n.believer=true; log(`${n.name}, once a skeptic, is moved to belief.`,'general',{silent:true}); }
    log(`${n.name} has been blessed.`,'general',{silent:true}); toast(`${n.name} blessed.`);
  } else if(power.id==='curse'){
    n.curseCount++; n.mood=clamp(n.mood-25,0,100); n.health=clamp(n.health-15,0,100);
    n.crimeInclination=clamp(n.crimeInclination+15,0,100); n.karma-=6;
    log(`${n.name} has been cursed.`,'general',{silent:true}); toast(`${n.name} cursed.`);
  } else if(power.id==='giftTalent'){
    if(n.status!=='infant'&&n.status!=='child'){ toast('Gift talent only works on children.'); return false; }
    n.talent=clamp(n.talent+50,0,100); n.giftedAtBirth=true;
    if(!n.traits.includes('Gifted')) n.traits.push('Gifted');
    log(`${n.name} is gifted with extraordinary talent.`,'family');
  } else if(power.id==='anointMessiah'){
    if(n.status!=='adult'&&n.status!=='elder'){ toast('Only adults may be anointed.'); return false; }
    if(town){ town.messiahId=n.id; }
    n.notable=true; n.role='messiah'; n.title='Messiah';
    if(!town.notableIds.includes(n.id)) town.notableIds.push(n.id);
    log(`${n.name} is anointed Messiah, spreading your worship across the world.`,'milestone');
  } else if(power.id==='freezePerson'){
    n.frozen=!n.frozen;
    log(n.frozen?`${n.name} is frozen outside the flow of time.`:`${n.name} thaws, and time takes hold of them again.`,'general',{silent:true});
    toast(n.frozen?`${n.name} frozen.`:`${n.name} unfrozen.`);
  }
  recordDivine(town,'blessing');
  markDirty('towns');
  return true;
}
function raiseDemon(soul){
  const cost=25;
  if(G.favor<cost){ toast('Not enough favor.'); return; }
  const towns=livingTowns(); if(!towns.length){ toast('No settlements exist to torment.'); return; }
  G.favor-=cost;
  soul.raised=true;
  const target=choice(towns);
  G.demons.push({id:uid('dm'),name:soul.name+' the Damned',townId:target.id,until:G.tickCount+irand(25,50)});
  log(`${soul.name} rises from Hell as a demon, unleashed upon ${target.name}!`,'disaster');
  markDirty('header'); markDirty('towns');
}

/* ============================== MUTATION MODAL ============================== */
function showMutationChoice(){
  G._mutationModalOpen=true;
  const opts=MUTATION_CHOICES[G.evolutionStage];
  const nextName=STAGE_NAMES[G.evolutionStage+1];
  openModal(`
    <button class="modalClose" data-close="1">×</button>
    <h2>Evolution Beckons</h2>
    <div class="mSub">Your creature stands ready to become ${art(nextName)}. Choose its path.</div>
    <div class="mutOpts">
      ${opts.map((o,i)=>`<button class="mutOpt" data-mut="${i}"><b>${esc(o.name)}</b><span>${esc(o.desc)}</span></button>`).join('')}
