<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEMIURGE</title>
<style>
:root{
  --bg:#080a14; --panel:#11162a; --panel2:#161d38; --border:#2a3358;
  --gold:#e8c468; --gold-dim:#a9873f; --text:#dbe2f5; --text-dim:#8b93b8;
  --good:#6fbf73; --bad:#d1495b; --warn:#e0a63a; --water:#3f7fb0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:'Trebuchet MS','Segoe UI',sans-serif;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:999;flex-direction:column;gap:12px;}
#loading .glyph{font-size:48px;animation:pulse 2s infinite ease-in-out;}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
#loading .ltext{color:var(--gold);letter-spacing:4px;font-size:14px;text-transform:uppercase;}

#app{display:flex;flex-direction:column;height:100%;}

/* HEADER */
header#topbar{display:flex;align-items:center;gap:14px;padding:8px 14px;
  background:linear-gradient(180deg,#141b34,#0d1226);border-bottom:1px solid var(--border);
  flex-wrap:wrap;z-index:20;}
header#topbar h1{font-size:18px;margin:0;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 12px rgba(232,196,104,.5);white-space:nowrap;}
.eraTag{background:var(--panel2);border:1px solid var(--border);border-radius:12px;
  padding:3px 10px;font-size:12px;color:var(--text-dim);white-space:nowrap;}
.spacer{flex:1;}
.hstat{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-dim);white-space:nowrap;}
.hstat b{color:var(--gold);font-weight:600;}
.favorBar{width:90px;height:8px;background:#000;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.favorBar i{display:block;height:100%;background:linear-gradient(90deg,#7d5bd6,#c68be8);}
.speedBtns{display:flex;gap:3px;background:var(--panel2);border-radius:8px;padding:3px;border:1px solid var(--border);}
.speedBtns button{background:transparent;border:none;color:var(--text-dim);padding:4px 8px;
  border-radius:6px;font-size:12px;}
.speedBtns button.active{background:var(--gold);color:#241a00;font-weight:bold;}
.speedBtns button:hover:not(.active){background:#232b4c;color:var(--text);}
#eraJump{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;
  padding:4px 6px;font-size:12px;}
#saveInd{font-size:11px;color:var(--text-dim);opacity:0;transition:opacity .3s;white-space:nowrap;}
#saveInd.show{opacity:1;}
#resetWorldBtn{background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);
  border-radius:6px;padding:4px 9px;font-size:11px;white-space:nowrap;}
#resetWorldBtn:hover{border-color:var(--bad);color:var(--bad);}

/* MAIN */
main#mainArea{flex:1;display:flex;min-height:0;}
#mapWrap{flex:1;position:relative;background:#000;min-width:0;}
#mapCanvas{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:grab;touch-action:none;}
#zoomControls{position:absolute;bottom:14px;right:14px;display:flex;flex-direction:column;gap:4px;z-index:12;}
#zoomControls button{width:34px;height:34px;background:rgba(20,25,50,.9);border:1px solid var(--gold-dim);
  color:var(--gold);border-radius:8px;font-size:18px;font-weight:700;line-height:1;}
#zoomControls button:hover{border-color:var(--gold);background:rgba(30,36,66,.95);}
#targetBanner{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(20,25,50,.92);border:1px solid var(--gold);color:var(--gold);
  padding:7px 16px;border-radius:20px;font-size:13px;display:none;align-items:center;gap:10px;z-index:15;}
#targetBanner button{background:var(--bad);color:#fff;border:none;border-radius:12px;padding:3px 10px;font-size:11px;}
#townViewBar{position:absolute;top:10px;left:10px;right:10px;background:rgba(20,25,50,.92);border:1px solid var(--gold-dim);
  color:var(--text);padding:7px 12px;border-radius:10px;font-size:12px;display:none;align-items:center;gap:10px;flex-wrap:wrap;z-index:15;}
#townViewBar button{background:var(--panel2);color:var(--gold);border:1px solid var(--gold-dim);border-radius:6px;padding:4px 9px;font-size:11px;}
#townViewBar #townViewName{font-weight:700;color:var(--gold);}
#townViewBar #townViewClock{color:var(--text-dim);}
#voidHint{position:absolute;top:50%;right:24px;transform:translateY(-50%);max-width:220px;
  background:rgba(20,25,50,.94);border:1px solid var(--gold);color:var(--text);
  padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.5;display:none;
  box-shadow:0 0 24px rgba(232,196,104,.25);animation:hintPulse 2.4s infinite ease-in-out;}
#voidHint b{color:var(--gold);}
@keyframes hintPulse{0%,100%{box-shadow:0 0 14px rgba(232,196,104,.2);}50%{box-shadow:0 0 30px rgba(232,196,104,.45);}}
.genesisBtn:not(:disabled){animation:genesisReady 1.8s infinite ease-in-out;}
@keyframes genesisReady{0%,100%{border-color:var(--gold-dim);}50%{border-color:var(--gold);}}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(20,25,50,.95);border:1px solid var(--border);color:var(--text);
  padding:8px 16px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:15;}
#toast.show{opacity:1;}
#tileTip{position:absolute;pointer-events:none;background:rgba(10,12,24,.9);border:1px solid var(--border);
  color:var(--text-dim);font-size:11px;padding:4px 8px;border-radius:5px;display:none;z-index:14;white-space:nowrap;}

/* SIDEBAR */
aside#sidebar{width:360px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);
  border-left:1px solid var(--border);min-height:0;}
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
#tabs button{flex:1;background:transparent;border:none;color:var(--text-dim);padding:10px 4px;
  font-size:11px;border-bottom:2px solid transparent;position:relative;}
#tabs button.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--panel2);}
#tabs button .badge{position:absolute;top:4px;right:8px;background:var(--bad);color:#fff;
  border-radius:8px;font-size:9px;padding:1px 5px;}
#tabContent{flex:1;overflow-y:auto;min-height:0;}
.tabpanel{display:none;padding:10px;}
.tabpanel.active{display:block;}
#panel-console.active{display:flex;flex-direction:column;height:100%;padding:0;}
#consoleOutput{flex:1;overflow-y:auto;padding:10px;font-family:'Courier New',monospace;font-size:12px;
  line-height:1.6;color:var(--text-dim);}
#consoleOutput .cLine{white-space:pre-wrap;word-break:break-word;margin-bottom:2px;}
#consoleOutput .cCmd{color:var(--gold);}
#consoleOutput .cResult{color:var(--good);}
#consoleOutput .cError{color:var(--bad);}
#consoleOutput .cInfo{color:var(--text-dim);}
#consoleInputRow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);
  padding:8px 10px;flex-shrink:0;background:var(--panel2);}
#debugPanel{flex-shrink:0;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--panel2);
  display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-family:'Courier New',monospace;font-size:10.5px;color:var(--text-dim);}
#debugPanel b{color:var(--gold);}
#debugPanel .dpHead{grid-column:1/-1;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-size:9.5px;margin-top:4px;}
#debugPanel .dpHead:first-child{margin-top:0;}
#consolePrompt{color:var(--gold);font-family:'Courier New',monospace;font-weight:700;}
#consoleInput{flex:1;background:#05060c;border:1px solid var(--border);color:var(--text);
  font-family:'Courier New',monospace;font-size:12px;border-radius:6px;padding:7px 9px;}
#consoleRun{background:var(--gold);color:#241a00;border:none;border-radius:6px;padding:7px 12px;
  font-size:12px;font-weight:700;}
.panelHead{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);
  margin:12px 0 6px;}
.panelHead:first-child{margin-top:0;}
.searchBar input{width:100%;box-sizing:border-box;background:#05060c;border:1px solid var(--border);
  color:var(--text);font-size:13px;border-radius:6px;padding:8px 10px;}
.techLadder{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px;}
.techStep{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:6px;font-size:14px;border:1px solid var(--border);opacity:0.35;filter:grayscale(1);}
.techStep.done{opacity:0.7;filter:grayscale(0.4);border-color:var(--gold-dim);}
.techStep.current{opacity:1;filter:none;border-color:var(--gold);background:rgba(232,196,104,0.15);
  box-shadow:0 0 0 1px var(--gold);}

/* Power buttons */
.powerBtn{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;margin-bottom:6px;color:var(--text);display:flex;
  align-items:center;gap:10px;font-size:12px;transition:.15s;}
.powerBtn:hover:not(:disabled){border-color:var(--gold);transform:translateX(2px);}
.powerBtn:disabled{opacity:.35;cursor:not-allowed;}
.powerBtn.selected{border-color:var(--gold);background:#2a2340;}
.powerBtn .pIcon{font-size:18px;width:22px;text-align:center;}
.powerBtn .pName{flex:1;font-weight:600;}
.powerBtn .pCost{color:var(--gold);font-size:11px;}
.powerBtn .pSub{display:block;font-weight:400;color:var(--text-dim);font-size:10px;margin-top:1px;}
.genesisBtn{background:linear-gradient(135deg,#241a3d,#161d38);border-color:var(--gold-dim);}
.genesisBtn.done{opacity:.5;}
.genesisBtn.done .pIcon:after{content:' ✓';color:var(--good);}

/* Prayer cards */
.prayerCard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;margin-bottom:8px;}
.prayerCard .pTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.prayerCard .pTown{font-weight:600;color:var(--gold);font-size:12px;}
.prayerCard .pType{font-size:10px;color:var(--text-dim);text-transform:uppercase;}
.prayerCard .pText{font-size:12px;color:var(--text);margin-bottom:8px;}
.prayerCard .pActions{display:flex;gap:6px;}
.prayerCard button{flex:1;border:none;border-radius:6px;padding:5px;font-size:11px;font-weight:600;}
.btnApprove{background:var(--good);color:#082;}
.btnDeny{background:var(--bad);color:#fff;}
.emptyState{color:var(--text-dim);font-size:12px;text-align:center;padding:24px 10px;}

/* Specimen */
#specimenView{text-align:center;padding:10px;}
.specGlyph{font-size:64px;margin:6px 0;filter:drop-shadow(0 0 14px rgba(232,196,104,.35));}
.specStage{font-size:15px;font-weight:700;color:var(--gold);}
.specSub{font-size:11px;color:var(--text-dim);margin-bottom:10px;}
.progWrap{background:#000;border:1px solid var(--border);border-radius:6px;height:10px;
  overflow:hidden;margin:6px 0;}
.progWrap i{display:block;height:100%;background:linear-gradient(90deg,#5b8fd6,#8be8c6);}
.traitTag{display:inline-block;background:var(--panel2);border:1px solid var(--gold-dim);
  color:var(--gold);border-radius:10px;padding:2px 9px;font-size:10px;margin:3px 2px;}

/* Town cards */
.townCard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;margin-bottom:8px;cursor:pointer;}
.townCard:hover{border-color:var(--gold);}
.townCard .tTop{display:flex;justify-content:space-between;align-items:center;}
.townCard .tName{font-weight:700;color:var(--gold);font-size:13px;}
.townCard .tTech{font-size:10px;color:var(--text-dim);}
.townCard .tStats{display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--text-dim);flex-wrap:wrap;}
.townCard .tStats span b{color:var(--text);}
.flag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;}
.flag.war{background:#4a1a1a;color:var(--bad);}
.flag.disease{background:#3a2a10;color:var(--warn);}

/* Chronicle footer */
footer#chronicle{flex-shrink:0;background:#05060c;border-top:1px solid var(--border);
  height:120px;display:flex;flex-direction:column;transition:height .2s;}
footer#chronicle.collapsed{height:30px;}
#chronHead{display:flex;align-items:center;padding:4px 12px;gap:8px;flex-shrink:0;cursor:pointer;
  border-bottom:1px solid var(--border);}
#chronHead b{font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
#chronHead .toggle{margin-left:auto;color:var(--text-dim);font-size:12px;}
#chronLog{flex:1;overflow-y:auto;padding:4px 12px;font-size:12px;line-height:1.6;}
#chronLog div{padding:1px 0;}
#chronLog .tag{color:var(--text-dim);margin-right:5px;font-size:10px;}
.cat-milestone{color:var(--gold);font-weight:600;}
.cat-notable{color:#8be8c6;}
.cat-crime{color:var(--bad);}
.cat-disease{color:var(--warn);}
.cat-tech{color:#8bb3e8;}
.cat-disaster{color:#ff8a5b;}
.cat-family{color:#e8a3d0;}
.cat-death{color:#9a9fbd;}
.cat-time{color:var(--gold-dim);font-style:italic;}

/* Modals */
#modalRoot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(3,4,10,.72);z-index:100;padding:20px;}
#modalRoot.show{display:flex;}
.modalBox{background:var(--panel);border:1px solid var(--gold-dim);border-radius:12px;
  max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:18px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modalBox h2{margin:0 0 4px;color:var(--gold);font-size:18px;}
.modalBox .mSub{color:var(--text-dim);font-size:12px;margin-bottom:14px;}
.modalClose{float:right;background:transparent;border:none;color:var(--text-dim);font-size:20px;}
.mutOpts{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.mutOpt{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;
  text-align:left;color:var(--text);}
.mutOpt:hover{border-color:var(--gold);}
.mutOpt b{color:var(--gold);display:block;font-size:14px;margin-bottom:3px;}
.mutOpt span{font-size:12px;color:var(--text-dim);}
.statRow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;}
.statRow .label{width:60px;color:var(--text-dim);}
.statRow .bar{flex:1;height:7px;background:#000;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.statRow .bar i{display:block;height:100%;}
.modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0;}
.actionRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.actionRow button{background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);
  border-radius:6px;padding:7px 12px;font-size:12px;}
.actionRow button:hover:not(:disabled){background:var(--gold);color:#241a00;}
.actionRow button:disabled{opacity:.35;cursor:not-allowed;}
.actionRow button.selected{background:var(--gold);color:#241a00;}
.swatchRow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px;}
.swatch{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);cursor:pointer;}
.swatch.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,196,104,.4);}
.chField{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 9px;font-size:13px;}
.miniPortrait{flex-shrink:0;width:22px;height:22px;line-height:0;}
.miniPortrait svg{display:block;border-radius:5px;}
.modalPortrait{flex-shrink:0;line-height:0;}
.modalPortrait svg{display:block;border-radius:10px;}
.npcList{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:6px;}
.npcRow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);
  cursor:pointer;font-size:12px;}
.npcRow:last-child{border-bottom:none;}
.npcRow:hover{background:var(--panel2);}
.npcRow .nm{flex:1;}
.npcRow .role{color:var(--gold);font-size:10px;}
.soulCol h4{font-size:12px;margin:0 0 6px;text-transform:uppercase;letter-spacing:1px;}
.soulRow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
  border:1px solid var(--border);border-radius:6px;padding:5px 8px;margin-bottom:5px;font-size:11px;}
.soulRow button{background:var(--bad);color:#fff;border:none;border-radius:5px;padding:3px 7px;font-size:10px;}
.soulRow button:disabled{opacity:.3;}
.pendingBanner{background:#2a2340;border:1px solid var(--gold);border-radius:8px;padding:8px 10px;
  margin-bottom:10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pendingBanner button{background:var(--gold);color:#241a00;border:none;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;}

::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2a3358;border-radius:4px;}

@media (max-width:820px){
  aside#sidebar{position:absolute;right:0;top:0;bottom:0;width:86vw;max-width:360px;
    transform:translateX(100%);transition:transform .25s;box-shadow:-10px 0 30px rgba(0,0,0,.5);}
  aside#sidebar.mobileOpen{transform:translateX(0);}
  #mobileToggle{display:inline-flex;}
}
#mobileToggle{display:none;background:var(--panel2);border:1px solid var(--border);color:var(--gold);
  border-radius:6px;padding:5px 9px;font-size:14px;}
</style>
</head>
<body>

<div id="loading"><div class="glyph">✦</div><div class="ltext">Demiurge Awakens</div></div>

<div id="app" style="display:none">
  <header id="topbar">
    <h1>✦ DEMIURGE</h1>
    <span class="eraTag" id="eraTag">The Void</span>
    <span class="hstat" id="dateStat">Day 0</span>
    <button id="mobileToggle">☰</button>
    <div class="spacer"></div>
    <span class="hstat">Favor <div class="favorBar"><i id="favorFill" style="width:0%"></i></div> <b id="favorNum">0</b></span>
    <select id="eraJump" title="Leap to an era"></select>
    <div class="speedBtns" id="speedBtns">
      <button data-speed="pause">⏸</button>
      <button data-speed="1">1x</button>
      <button data-speed="2">2x</button>
      <button data-speed="5">5x</button>
      <button data-speed="10">10x</button>
    </div>
    <span id="saveInd">saved</span>
    <button id="resetWorldBtn" title="Wipe this save and start over">🔄 New World</button>
  </header>

  <main id="mainArea">
    <div id="mapWrap">
      <canvas id="mapCanvas"></canvas>
      <div id="targetBanner"><span id="targetText"></span><button id="cancelTarget">cancel</button></div>
      <div id="townViewBar"><button id="backToWorld">← Back to World</button><span id="townViewName"></span><span id="townViewClock"></span>
        <button id="focusPrev" title="Previous citizen">◀ Person</button><button id="focusNext" title="Next citizen">Person ▶</button><button id="focusClear" title="Zoom back out">⤢ Zoom out</button></div>
      <div id="tileTip"></div>
      <div id="toast"></div>
      <div id="voidHint">✦ Begin here — open <b>Powers</b> and speak Creation into being →</div>
      <div id="zoomControls"><button id="zoomIn" title="Zoom in">+</button><button id="zoomOut" title="Zoom out">−</button></div>
    </div>
    <aside id="sidebar">
      <div id="tabs">
        <button class="tab active" data-tab="powers">⚡ Powers</button>
        <button class="tab" data-tab="prayers">🙏 Prayers<span class="badge" id="prayerBadge" style="display:none">0</span></button>
        <button class="tab" data-tab="specimen">🧬 Specimen</button>
        <button class="tab" data-tab="towns">🏘 Peoples</button>
        <button class="tab" data-tab="console">⌘ Console</button>
      </div>
      <div id="tabContent">
        <section class="tabpanel active" id="panel-powers"></section>
        <section class="tabpanel" id="panel-prayers"></section>
        <section class="tabpanel" id="panel-specimen"></section>
        <section class="tabpanel" id="panel-towns"></section>
        <section class="tabpanel" id="panel-console">
          <div id="debugPanel"></div>
          <div id="consoleOutput"><div class="cLine cInfo">Divine Console — direct, unrestricted access to your world. Type help() to begin.</div></div>
          <div id="consoleInputRow">
            <span id="consolePrompt">›</span>
            <input id="consoleInput" type="text" autocomplete="off" spellcheck="false" placeholder="help()"/>
            <button id="consoleRun">Run</button>
          </div>
        </section>
      </div>
    </aside>
  </main>

  <footer id="chronicle">
    <div id="chronHead"><b>Chronicle</b><span class="toggle" id="chronToggle">▾</span></div>
    <div id="chronLog"></div>
  </footer>
</div>

<div id="modalRoot"><div class="modalBox" id="modalBox"></div></div>

<script>
'use strict';
/* ============================== UTILITIES ============================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function irand(a,b){return Math.floor(rand(a,b+1));}
function choice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function uid(prefix){return prefix+(idSeq++).toString(36);}
let idSeq=1;
function art(word){return /^[aeiou]/i.test(word)?'an '+word:'a '+word;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function capitalize(s){s=String(s||'');return s?s[0].toUpperCase()+s.slice(1):s;}

/* Appearance space is deliberately wide (7*8*5*4*10*3 = 33,600 combos) and,
   when a town is given, dedupes against that town's own citizens so no two
   people in the same country end up looking identical. */
function randomAppearanceRoll(){
  return {skin:irand(0,SKIN_TONES.length-1),hairColor:irand(0,HAIR_COLORS.length-1),
    eyeColor:irand(0,EYE_COLORS.length-1),hairStyle:choice(Object.keys(HAIR_STYLES)),
    clothingColor:irand(0,CLOTHING_COLORS.length-1),build:irand(0,BUILDS.length-1)};
}
function appearanceSig(app){
  return `${app.skin}|${app.hairColor}|${app.eyeColor}|${app.hairStyle}|${app.clothingColor}|${app.build}`;
}
function randomAppearance(town){
  if(!town) return randomAppearanceRoll();
  const used=town._usedAppearanceSigs||(town._usedAppearanceSigs=new Set());
  let app, sig, tries=0;
  do{ app=randomAppearanceRoll(); sig=appearanceSig(app); tries++; }
  while(used.has(sig) && tries<40);
  used.add(sig);
  return app;
}
function portraitSVG(app,size){
  app=app||randomAppearanceRoll();
  size=size||64;
  const skin=SKIN_TONES[app.skin??0]||SKIN_TONES[0];
  const hairColor=HAIR_COLORS[app.hairColor??0]||HAIR_COLORS[0];
  const eyeColor=EYE_COLORS[app.eyeColor??0]||EYE_COLORS[0];
  const clothing=CLOTHING_COLORS[app.clothingColor??0]||CLOTHING_COLORS[0];
  const buildScale=[0.88,1,1.14][app.build??1]||1;
  const hairFn=HAIR_STYLES[app.hairStyle]||HAIR_STYLES.short;
  const bw=25*buildScale;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="14" fill="#0d1226"/>
    <path d="M20 100 Q22 78 50 78 Q78 78 80 100 Z" fill="${clothing}"/>
    <ellipse cx="50" cy="62" rx="${bw}" ry="29" fill="${skin}"/>
    <ellipse cx="38" cy="56" rx="3.2" ry="4" fill="${eyeColor}"/>
    <ellipse cx="62" cy="56" rx="3.2" ry="4" fill="${eyeColor}"/>
    <path d="M42 73 Q50 79 58 73" stroke="#5a3a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${hairFn(hairColor)}
  </svg>`;
}

/* Each country is a closed population that should settle around a stable
   carrying capacity rather than growing forever: births taper off as a
   country nears POP_CAP (logistic growth), and crowding above the cap
   raises mortality until births and deaths balance back out near 1000. */
const POP_CAP=1000;
function homeostasisFactor(pop){ return clamp(1-pop/POP_CAP,0,1); }
function crowdingFactor(pop){ return pop>POP_CAP?1+((pop-POP_CAP)/POP_CAP)*1.6:1; }

function buildGrid(w,h,seed){
  const rand1=mulberry32(seed), rand2=mulberry32(seed^0x9e3779b9), rand3=mulberry32(seed^0x85ebca6b);
  const elev=smoothNoise(w,h,rand1,7);
  const elevDetail=smoothNoise(w,h,rand2,2);
  const moist=smoothNoise(w,h,rand3,5);
  const finalElev=new Array(w*h);
  for(let i=0;i<w*h;i++) finalElev[i]=clamp(elev[i]*0.75+elevDetail[i]*0.25,0,1);
  const variance=new Array(w*h);
  for(let i=0;i<w*h;i++) variance[i]=Math.random();
  return {w,h,tiles:new Array(w*h).fill(TILE.VOID),overlay:new Array(w*h).fill(null),
    elev:finalElev,moist,variance};
}
function smoothNoise(w,h,rng,passes){
  let map=new Array(w*h);
  for(let i=0;i<w*h;i++) map[i]=rng();
  for(let p=0;p<passes;p++){
    const next=new Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let sum=0,count=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;
        if(nx>=0&&nx<w&&ny>=0&&ny<h){sum+=map[ny*w+nx];count++;}
      }
      next[y*w+x]=sum/count;
    }
    map=next;
  }
  let min=1,max=0;
  for(const v of map){if(v<min)min=v;if(v>max)max=v;}
  const range=Math.max(1e-6,max-min);
  return map.map(v=>(v-min)/range);
}
function idx(g,x,y){return y*g.w+x;}
function inBounds(g,x,y){return x>=0&&y>=0&&x<g.w&&y<g.h;}

function doGenesisWaters(g){
  for(let i=0;i<g.tiles.length;i++) g.tiles[i]=TILE.WATER;
}
function doGenesisLand(g){
  const waterLevel=0.42, mountainLevel=0.78;
  for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){
    const i=idx(g,x,y); const e=g.elev[i];
    const lat=Math.abs(y/(g.h-1)-0.5)*2;
    if(e<=waterLevel){ g.tiles[i]=TILE.WATER; continue; }
    if(lat>0.86){ g.tiles[i]=TILE.ICE; continue; }
    g.tiles[i]= e>mountainLevel ? TILE.MOUNTAIN : TILE.LAND;
  }
  doGenesisRivers(g);
}
/* Rivers: a steepest-descent walk from each of a handful of mountain tiles
   down to the sea (or wherever the elevation bottoms out), turning every
   tile it crosses into water. Reuses TILE.WATER rather than a new tile type
   -- a winding one-tile ribbon through land already reads as a river, and it
   picks up all of water's existing rendering and near-water siting logic
   for free. */
function doGenesisRivers(g){
  const mountains=[];
  for(let i=0;i<g.tiles.length;i++){ if(g.tiles[i]===TILE.MOUNTAIN) mountains.push(i); }
  if(!mountains.length) return;
  const rng=mulberry32(((g.w*7919+g.h*104729)^0x2545F4914F6CDD1D)>>>0);
  const riverCount=clamp(Math.round((g.w*g.h)/900),2,6);
  for(let r=0;r<riverCount;r++){
    let cur=mountains[Math.floor(rng()*mountains.length)];
    const visited=new Set();
    for(let step=0;step<g.w+g.h;step++){
      if(visited.has(cur)||g.tiles[cur]===TILE.WATER) break;
      visited.add(cur);
      if(g.tiles[cur]!==TILE.MOUNTAIN) g.tiles[cur]=TILE.WATER;
      const cx=cur%g.w, cy=Math.floor(cur/g.w);
      let best=-1, bestElev=g.elev[cur];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy) continue;
        const nx=cx+dx, ny=cy+dy;
        if(!inBounds(g,nx,ny)) continue;
        const ni=idx(g,nx,ny);
        if(g.elev[ni]<bestElev){ bestElev=g.elev[ni]; best=ni; }
      }
      if(best===-1) break;
      cur=best;
    }
  }
}
function doGenesisVegetation(g){
  for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){
    const i=idx(g,x,y);
    if(g.tiles[i]!==TILE.LAND) continue;
    const m=g.moist[i];
    if(m<0.35) g.tiles[i]=TILE.DESERT;
    else if(m>0.62) g.tiles[i]=TILE.FOREST;
  }
}
