/* ============================== POWER SELECTION / TARGETING ============================== */
function isPowerUnlocked(p){
  if(p.minEra!==undefined && G.era<p.minEra) return false;
  if(p.maxEra!==undefined && G.era>p.maxEra) return false;
  if(p.requiresAtomic && !atomicUnlocked()) return false;
  return true;
}
function selectPower(id){
  const p=POWER_BY_ID[id];
  if(!p) return;
  if(!isPowerUnlocked(p)){ toast('Not available yet.'); return; }
  if(p.id==='openUnderworld'){ openUnderworldModal(); return; }
  if(p.id==='createHuman'){ openCreateHumanModal(); return; }
  if(p.target==='none'){
    if(G.favor<p.cost){ toast('Not enough favor.'); return; }
    G.favor-=p.cost;
    if(p.id==='seedLife') doSeedLife();
    else if(p.id==='quickenEvolution') doQuickenEvolution();
    else if(p.id==='freezeTime') doFreezeTime();
    markDirty('header');
    return;
  }
  if(G.favor<p.cost){ toast('Not enough favor.'); return; }
  if((p.target==='tile'||p.target==='town'||p.target==='town-pair') && G.viewMode==='town') exitTownView();
  G.pendingPower={def:p,first:null};
  markDirty('powers');
  updateTargetBanner();
}
function clearPending(){ G.pendingPower=null; updateTargetBanner(); markDirty('powers'); }
function updateTargetBanner(){
  const banner=document.getElementById('targetBanner');
  const text=document.getElementById('targetText');
  if(!G.pendingPower){ banner.style.display='none'; return; }
  const p=G.pendingPower.def;
  let msg='';
  if(p.target==='tile') msg=`Click a location to cast ${p.name}.`;
  else if(p.target==='town') msg=`Click a settlement to target with ${p.name}.`;
  else if(p.target==='town-pair') msg = G.pendingPower.first?`${G.pendingPower.first.name} selected — click the second settlement.`:`Click the first settlement for ${p.name}.`;
  else if(p.target==='npc') msg=`Open a citizen from Peoples to apply ${p.name}.`;
  text.textContent=msg;
  banner.style.display='flex';
}
function resolvePowerTarget(tx,ty){
  const p=G.pendingPower.def;
  if(p.id==='rain'||p.id==='drought'||p.id==='lightning'||p.id==='earthquake'||p.id==='flood'||p.id==='volcano'||p.id==='meteor'){
    if(p.target!=='tile') return;
  }
  if(p.target==='tile'){
    const t=G.grid.tiles[idx(G.grid,tx,ty)];
    if(t===TILE.VOID){ toast('There is nothing there yet.'); return; }
    G.favor-=p.cost;
    applyTilePower(p,tx,ty);
    clearPending(); markDirty('header');
  } else if(p.target==='town'){
    const town=findTownAt(tx,ty);
    if(!town){ toast('Select a settlement.'); return; }
    G.favor-=p.cost;
    applyTownPower(p,town);
    clearPending(); markDirty('header');
  } else if(p.target==='town-pair'){
    const town=findTownAt(tx,ty);
    if(!town){ toast('Select a settlement.'); return; }
    if(!G.pendingPower.first){
      G.pendingPower.first=town;
      updateTargetBanner();
    } else if(town.id===G.pendingPower.first.id){
      toast('Choose a different settlement.');
    } else {
      G.favor-=p.cost;
      applyTownPairPower(p,G.pendingPower.first,town);
      clearPending(); markDirty('header');
    }
  }
}
function findTownAt(tx,ty){
  return livingTowns().find(t=>Math.abs(t.x-tx)<=1 && Math.abs(t.y-ty)<=1);
}

/* ============================== RENDERING ============================== */
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
let mapMetrics={tileSize:10,offsetX:0,offsetY:0};
const MIN_ZOOM=1, MAX_ZOOM=7;
let camera={x:30,y:18,zoom:1};
function resetCamera(){
  if(G&&G.grid) camera={x:G.grid.w/2,y:G.grid.h/2,zoom:1};
}

function resizeCanvas(){
  const wrap=document.getElementById('mapWrap');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(wrap.clientWidth*dpr);
  canvas.height=Math.floor(wrap.clientHeight*dpr);
  renderCanvas();
}
function renderCanvas(){
  if(G.viewMode==='town'){
    const town=townOf(G.viewingTownId);
    if(!town||!town.alive){ exitTownView(); drawMap(); }
    else drawTownView(town);
  } else {
    drawMap();
  }
}
function getMapMetrics(){
  if(!G||!G.grid) return mapMetrics;
  const g=G.grid;
  const fitTileSize=Math.min(canvas.width/g.w,canvas.height/g.h);
  const rawTileSize=Math.max(1,fitTileSize*camera.zoom);
  const viewTilesW=canvas.width/rawTileSize, viewTilesH=canvas.height/rawTileSize;
  if(viewTilesW<g.w){ camera.x=clamp(camera.x,viewTilesW/2,g.w-viewTilesW/2); } else { camera.x=g.w/2; }
  if(viewTilesH<g.h){ camera.y=clamp(camera.y,viewTilesH/2,g.h-viewTilesH/2); } else { camera.y=g.h/2; }
  // Snap to integer pixels so tile edges never sit on a fractional coordinate --
  // canvas fillRect anti-aliases sub-pixel positions, which reads as a blurry map.
  const tileSize=Math.max(1,Math.round(rawTileSize));
  const offX=Math.round(canvas.width/2-camera.x*tileSize);
  const offY=Math.round(canvas.height/2-camera.y*tileSize);
  mapMetrics={tileSize,offsetX:offX,offsetY:offY};
  return mapMetrics;
}
function zoomMapAt(cx,cy,factor){
  const g=G.grid; if(!g) return;
  const fitTileSize=Math.min(canvas.width/g.w,canvas.height/g.h);
  const tileSizeBefore=Math.max(1,fitTileSize*camera.zoom);
  const worldX=camera.x+(cx-canvas.width/2)/tileSizeBefore;
  const worldY=camera.y+(cy-canvas.height/2)/tileSizeBefore;
  camera.zoom=clamp(camera.zoom*factor,MIN_ZOOM,MAX_ZOOM);
  const tileSizeAfter=Math.max(1,fitTileSize*camera.zoom);
  camera.x=worldX-(cx-canvas.width/2)/tileSizeAfter;
  camera.y=worldY-(cy-canvas.height/2)/tileSizeAfter;
}
function tileRGB(type,variance){
  const base=TILE_COLOR[type]||[0,0,0];
  const v=(variance-0.5)*18;
  return `rgb(${clamp(base[0]+v,0,255)|0},${clamp(base[1]+v,0,255)|0},${clamp(base[2]+v,0,255)|0})`;
}
function drawTileDetail(type,px,py,size,seed){
  if(size<11) return;
  if(type===TILE.FOREST){
    ctx.fillStyle='rgba(18,46,22,0.55)';
    const n=size>24?3:2;
    for(let i=0;i<n;i++){
      const fx=(Math.sin(seed*91.7+i*17.3)+1)/2, fy=(Math.sin(seed*53.1+i*29.1)+1)/2;
      const ox=px+(0.18+0.64*fx)*size, oy=py+(0.2+0.6*fy)*size, r=size*0.1;
      ctx.beginPath(); ctx.moveTo(ox,oy-r); ctx.lineTo(ox-r,oy+r*0.8); ctx.lineTo(ox+r,oy+r*0.8); ctx.closePath(); ctx.fill();
    }
  } else if(type===TILE.MOUNTAIN){
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.moveTo(px+size*0.5,py+size*0.14); ctx.lineTo(px+size*0.63,py+size*0.36); ctx.lineTo(px+size*0.37,py+size*0.36);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.moveTo(px+size*0.5,py+size*0.5); ctx.lineTo(px+size*0.78,py+size*0.86); ctx.lineTo(px+size*0.22,py+size*0.86);
    ctx.closePath(); ctx.fill();
  } else if(type===TILE.WATER){
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=Math.max(1,size*0.035);
    ctx.beginPath();
    ctx.moveTo(px+size*0.12,py+size*0.55+Math.sin(seed*40)*size*0.06);
    ctx.quadraticCurveTo(px+size*0.5,py+size*0.4,px+size*0.88,py+size*0.55+Math.cos(seed*40)*size*0.06);
    ctx.stroke();
  } else if(type===TILE.DESERT){
    ctx.strokeStyle='rgba(110,80,35,0.3)'; ctx.lineWidth=Math.max(1,size*0.03);
    ctx.beginPath(); ctx.moveTo(px+size*0.1,py+size*0.62); ctx.quadraticCurveTo(px+size*0.5,py+size*0.46,px+size*0.9,py+size*0.62); ctx.stroke();
  } else if(type===TILE.ICE){
    ctx.fillStyle='rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.arc(px+size*0.5,py+size*0.5,size*0.06,0,Math.PI*2); ctx.fill();
  } else if(type===TILE.LAND && size>16){
    ctx.strokeStyle='rgba(16,42,16,0.22)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(px+size*0.34,py+size*0.72); ctx.lineTo(px+size*0.34,py+size*0.55);
    ctx.moveTo(px+size*0.64,py+size*0.74); ctx.lineTo(px+size*0.64,py+size*0.6);
    ctx.stroke();
  }
}
function overlayColor(o,pulse){
  if(o.type==='rain') return 'rgba(80,140,220,0.35)';
  if(o.type==='drought') return 'rgba(196,150,50,0.3)';
  if(o.type==='flood') return 'rgba(50,100,180,0.5)';
  if(o.type==='fire') return `rgba(255,${100+Math.floor(pulse*80)},40,0.55)`;
  if(o.type==='lava') return `rgba(255,${80+Math.floor(pulse*60)},30,0.75)`;
  if(o.type==='ash') return 'rgba(90,80,70,0.4)';
  if(o.type==='radiation') return `rgba(140,255,90,${0.25+pulse*0.15})`;
  if(o.type==='quake') return 'rgba(150,120,80,0.35)';
  return 'transparent';
}
function drawMap(){
  if(!G||!G.grid){ ctx.fillStyle='#050610'; ctx.fillRect(0,0,canvas.width,canvas.height); return; }
  const g=G.grid;
  const {tileSize,offsetX,offsetY}=getMapMetrics();
  ctx.fillStyle='#050610';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const pulse=(Math.sin(Date.now()/300)+1)/2;
  const x0=Math.max(0,Math.floor(-offsetX/tileSize));
  const x1=Math.min(g.w-1,Math.ceil((canvas.width-offsetX)/tileSize));
  const y0=Math.max(0,Math.floor(-offsetY/tileSize));
  const y1=Math.min(g.h-1,Math.ceil((canvas.height-offsetY)/tileSize));
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      const i=idx(g,x,y);
      const px=offsetX+x*tileSize, py=offsetY+y*tileSize;
      ctx.fillStyle=tileRGB(g.tiles[i],g.variance[i]);
      ctx.fillRect(px,py,tileSize+1,tileSize+1);
      drawTileDetail(g.tiles[i],px,py,tileSize,g.variance[i]);
      const o=g.overlay[i];
      if(o){
        ctx.fillStyle=overlayColor(o,pulse);
        ctx.fillRect(px,py,tileSize+1,tileSize+1);
      }
    }
  }
  for(const t of livingTowns()){
    const cx=offsetX+t.x*tileSize+tileSize/2, cy=offsetY+t.y*tileSize+tileSize/2;
    /* Marker size actually reflects population -- a newborn 8-person village
       and a thriving 900-person country should never look identical on the
       world map. Scales from 1x up to ~2.5x as a country nears POP_CAP. */
    const popScale=1+clamp(t.population/POP_CAP,0,1)*1.5;
    const r=Math.max(tileSize*0.9,6)*popScale;
    ctx.beginPath(); ctx.arc(cx,cy,r*0.8,0,Math.PI*2);
    ctx.fillStyle= t.atWarWith.length? 'rgba(209,73,91,0.85)':'rgba(232,196,104,0.85)';
    ctx.fill();
    if(t.population>=300){
      ctx.strokeStyle='rgba(255,236,180,0.9)'; ctx.lineWidth=Math.max(1,tileSize*0.12); ctx.stroke();
    }
    ctx.font=`${Math.max(10,r*1.6)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(TECH_ICON[t.techStageIdx]||'🏕️',cx,cy);
    if(tileSize>=16){
      ctx.font=`${Math.max(9,tileSize*0.4)}px sans-serif`;
      ctx.fillStyle='rgba(255,255,255,0.85)';
      ctx.fillText(String(t.population),cx,cy+r*0.8+tileSize*0.35);
    }
  }
  for(const d of G.demons){
    const town=townOf(d.townId); if(!town) continue;
    const cx=offsetX+town.x*tileSize+tileSize/2, cy=offsetY+town.y*tileSize-tileSize*0.6;
    ctx.font=`${Math.max(12,tileSize*1.4)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha=0.6+pulse*0.4;
    ctx.fillText('👹',cx,cy);
    ctx.globalAlpha=1;
  }
  for(const c of G.caravans){
    const from=townOf(c.fromTownId), to=townOf(c.toTownId);
    if(!from||!to) continue;
    const t=clamp((G.tickCount-c.startTick)/c.duration,0,1);
    const wx=lerp(from.x,to.x,t), wy=lerp(from.y,to.y,t);
    const cx=offsetX+wx*tileSize+tileSize/2, cy=offsetY+wy*tileSize+tileSize/2;
    ctx.font=`${Math.max(10,tileSize*1.1)}px serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🐪',cx,cy);
  }
  if(G.pendingPower && G.pendingPower.def.target==='town-pair' && G.pendingPower.first){
    const t=G.pendingPower.first;
    const cx=offsetX+t.x*tileSize+tileSize/2, cy=offsetY+t.y*tileSize+tileSize/2;
    ctx.strokeStyle='#e8c468'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,tileSize*1.4,0,Math.PI*2); ctx.stroke();
  }
}

/* ============================== TOWN VIEW: LIVING WORLD ============================== */
/* Purely a camera/visual mode: NPC "wander" positions here are cosmetic and driven by
   real elapsed time, not the simulation tick -- they never touch population, mortality,
   or fertility math. The simulation keeps advancing normally underneath this view. */
const COSMETIC_DAY_MS=26000;
let cosmeticStart=performance.now();
let townViewScreenPos={};
function dayPhase(){ return ((performance.now()-cosmeticStart)%COSMETIC_DAY_MS)/COSMETIC_DAY_MS; }
function dayBrightness(phase){ return (Math.cos((phase-0.5)*2*Math.PI)+1)/2; }
function getTownViewMetrics(){
  const size=Math.min(canvas.width,canvas.height)*0.92;
  const offsetX=(canvas.width-size)/2, offsetY=(canvas.height-size)/2;
  return {scale:size/TOWN_VIEW_SIZE,offsetX,offsetY,size};
}
const JOB_COLORS={farmer:'#8a9b4f',miner:'#8a6a4a',artisan:'#a0632f',merchant:'#7a4fa0',laborer:'#6b7280',unemployed:'#56658a'};
const EMOJI_FONT='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function shadeHex(hex,percent){
  const num=parseInt((hex||'#888888').slice(1),16);
  const clamp255=v=>Math.max(0,Math.min(255,v));
  const r=clamp255((num>>16)+Math.round(2.55*percent));
  const g=clamp255(((num>>8)&0xff)+Math.round(2.55*percent));
  const b=clamp255((num&0xff)+Math.round(2.55*percent));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function drawPersonHair(style,color,headR,cy){
  if(!style||style==='bald') return;
  ctx.fillStyle=color;
  if(style==='long'){
    ctx.beginPath(); ctx.arc(0,cy-headR*0.1,headR*1.05,Math.PI*0.9,Math.PI*2.1); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-headR*0.88,cy+headR*0.55,headR*0.34,headR*0.85,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headR*0.88,cy+headR*0.55,headR*0.34,headR*0.85,0,0,Math.PI*2); ctx.fill();
  } else if(style==='curly'){
    const spots=[[-0.55,-0.3,0.42],[0,-0.5,0.48],[0.55,-0.3,0.42],[-0.28,-0.6,0.4],[0.28,-0.6,0.4]];
    for(const [dx,dy,rr] of spots){ ctx.beginPath(); ctx.arc(dx*headR,cy+dy*headR,rr*headR,0,Math.PI*2); ctx.fill(); }
  } else if(style==='bun'){
    ctx.beginPath(); ctx.arc(0,cy-headR*0.15,headR*1.02,Math.PI*0.95,Math.PI*2.05); ctx.fill();
    ctx.beginPath(); ctx.arc(0,cy-headR*1.05,headR*0.38,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0,cy-headR*0.15,headR*1.02,Math.PI*0.95,Math.PI*2.05); ctx.fill();
  }
}
/* Each citizen is drawn from their own appearance data (skin/hair/eyes/clothing/
   build) instead of a shared emoji glyph, so two citizens never render identically
   unless their whole appearance signature collided (see randomAppearance's dedupe).
   Shaded gradients + a real walk-cycle (swinging legs/arms, not just body sway) so
   figures read as bodies, not flat stickers. `detailed` is an LOD switch: full
   face+hair at normal/close zoom, a plain shaded silhouette when a country's
   population is too large to render every face at once at a glance. */
/* Vector-drawn tools, not emoji glyphs: color-bitmap emoji fonts (Noto Color
   Emoji in particular) can render wildly oversized at the large explicit pixel
   sizes the focus camera zooms to, so tool icons are drawn the same way the
   rest of the figure is -- plain canvas primitives that scale exactly with r
   on every device. */
function drawWorkTool(job,r,workPhase){
  if(!['farmer','miner','artisan','merchant'].includes(job)) return;
  const bob=Math.abs(Math.sin(workPhase||0))*r*0.3;
  const rot=Math.sin(workPhase||0)*0.6;
  const len=r*0.9;
  ctx.save();
  ctx.translate(r*0.95,-r*0.1-bob);
  ctx.rotate(rot);
  ctx.lineCap='round';
  if(job==='miner'){
    ctx.strokeStyle='#7a6a55'; ctx.lineWidth=Math.max(1.4,r*0.14);
    ctx.beginPath(); ctx.moveTo(0,len*0.35); ctx.lineTo(0,-len*0.55); ctx.stroke();
    ctx.strokeStyle='#c8c8d0'; ctx.lineWidth=Math.max(1.6,r*0.16);
    ctx.beginPath(); ctx.moveTo(-len*0.42,-len*0.65); ctx.lineTo(len*0.42,-len*0.65); ctx.stroke();
  } else if(job==='artisan'){
    ctx.strokeStyle='#7a5a3a'; ctx.lineWidth=Math.max(1.4,r*0.14);
    ctx.beginPath(); ctx.moveTo(0,len*0.4); ctx.lineTo(0,-len*0.4); ctx.stroke();
    ctx.fillStyle='#8a8a92';
    ctx.fillRect(-len*0.32,-len*0.62,len*0.64,len*0.3);
  } else if(job==='farmer'){
    ctx.strokeStyle='#7a6a4a'; ctx.lineWidth=Math.max(1.3,r*0.12);
    ctx.beginPath(); ctx.moveTo(0,len*0.4); ctx.lineTo(0,-len*0.5); ctx.stroke();
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=Math.max(1.2,r*0.1);
    for(const a of [-0.5,-0.15,0.2,0.5]){
      ctx.beginPath(); ctx.moveTo(0,-len*0.5); ctx.lineTo(Math.sin(a)*len*0.35,-len*0.5-Math.cos(a)*len*0.35); ctx.stroke();
    }
  } else if(job==='merchant'){
    ctx.fillStyle='#e8c25a';
    ctx.beginPath(); ctx.arc(0,0,len*0.32,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#8a6a20'; ctx.lineWidth=Math.max(1,r*0.06); ctx.stroke();
  }
  ctx.restore();
}
function drawPersonFigure(r,app,status,detailed,walking,walkPhase,working,workPhase,job){
  app=app||{};
  const skin=SKIN_TONES[app.skin??2]||SKIN_TONES[2];
  const clothing=CLOTHING_COLORS[app.clothingColor??0]||CLOTHING_COLORS[0];
  const buildScale=[0.84,1,1.18][app.build??1]||1;
  const isChild=status==='infant'||status==='child';
  const headR=r*(isChild?0.6:0.48)*(isChild?1:buildScale*0.5+0.5);
  const bodyW=r*0.62*buildScale*(isChild?0.72:1);
  const bodyH=r*(isChild?1.05:1.42);
  const headCy=-r*0.28;
  const hipY=r*0.5+bodyH*0.42;
  const limbLen=r*(isChild?0.4:0.6);
  const legSwing=walking?Math.sin(walkPhase||0)*limbLen*0.5:0;
  const armSwing=walking?Math.sin(walkPhase||0)*limbLen*0.5:(working?Math.sin(workPhase||0)*limbLen*0.65:0);

  ctx.strokeStyle=shadeHex(clothing,-32);
  ctx.lineWidth=Math.max(1.3,r*0.15);
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.3,hipY); ctx.lineTo(-bodyW*0.3+legSwing,hipY+limbLen);
  ctx.moveTo(bodyW*0.3,hipY); ctx.lineTo(bodyW*0.3-legSwing,hipY+limbLen);
  ctx.stroke();
  ctx.strokeStyle=shadeHex(skin,-15);
  ctx.lineWidth=Math.max(1,r*0.11);
  ctx.beginPath();
  ctx.moveTo(-bodyW*0.75,r*0.15); ctx.lineTo(-bodyW*0.75-armSwing*0.6,r*0.15+limbLen*0.7);
  ctx.moveTo(bodyW*0.75,r*0.15); ctx.lineTo(bodyW*0.75+armSwing*0.6,r*0.15+limbLen*0.7);
  ctx.stroke();

  const bodyGrad=ctx.createLinearGradient(-bodyW,r*0.5-bodyH*0.5,bodyW,r*0.5+bodyH*0.5);
  bodyGrad.addColorStop(0,shadeHex(clothing,14));
  bodyGrad.addColorStop(1,shadeHex(clothing,-18));
  ctx.beginPath();
  ctx.ellipse(0,r*0.5,bodyW,bodyH*0.5,0,0,Math.PI*2);
  ctx.fillStyle=bodyGrad; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.lineWidth=Math.max(0.6,r*0.05); ctx.stroke();

  const headGrad=ctx.createRadialGradient(-headR*0.3,headCy-headR*0.3,headR*0.15,0,headCy,headR*1.1);
  headGrad.addColorStop(0,shadeHex(skin,16));
  headGrad.addColorStop(1,shadeHex(skin,-12));
  ctx.beginPath();
  ctx.arc(0,headCy,headR,0,Math.PI*2);
  ctx.fillStyle=headGrad; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=Math.max(0.5,r*0.04); ctx.stroke();

  if(detailed){
    const hairColor=HAIR_COLORS[app.hairColor??0]||HAIR_COLORS[0];
    drawPersonHair(app.hairStyle,hairColor,headR,headCy);
    const eyeColor=EYE_COLORS[app.eyeColor??0]||EYE_COLORS[0];
    ctx.fillStyle=eyeColor;
    ctx.beginPath(); ctx.ellipse(-headR*0.34,headCy+headR*0.05,headR*0.13,headR*0.16,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headR*0.34,headCy+headR*0.05,headR*0.13,headR*0.16,0,0,Math.PI*2); ctx.fill();
    if(working) drawWorkTool(job,r,workPhase);
  }
}
function drawNpcDot(cx,cy,r,n,walking,walkPhase,detailed,working,workPhase,jailed){
  const bob=walking?Math.abs(Math.sin(walkPhase||0))*r*0.12:(working?Math.abs(Math.sin((workPhase||0)*0.5))*r*0.05:0);
  if(n.frozen){
    ctx.beginPath(); ctx.arc(cx,cy,r*1.15,0,Math.PI*2);
    ctx.fillStyle='rgba(140,210,255,0.3)'; ctx.fill();
    ctx.strokeStyle='rgba(180,225,255,0.9)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.save();
  ctx.translate(cx,cy-bob);
  drawPersonFigure(r,n.appearance,n.status,detailed!==false,walking,walkPhase,working,workPhase,n.job);
  if(jailed){
    ctx.strokeStyle='rgba(20,20,25,0.55)'; ctx.lineWidth=Math.max(1,r*0.09);
    for(const dx of [-0.4,0,0.4]){ ctx.beginPath(); ctx.moveTo(dx*r,-r*1.3); ctx.lineTo(dx*r,r*0.9); ctx.stroke(); }
  }
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(cx,cy+r*1.05,r*0.5,r*0.16,0,0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy+r*1.05,r*0.22,0,Math.PI*2);
  ctx.fillStyle=JOB_COLORS[n.job]||JOB_COLORS.unemployed; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)'; ctx.lineWidth=0.5; ctx.stroke();
  if(n.notable){
    ctx.font=`${Math.min(r*1.15,26)}px ${EMOJI_FONT}`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('\u{1F451}',cx,cy-r*1.9);
  }
}

/* Real point-to-point walking instead of an orbiting wobble: each tracked citizen
   has a small persistent motion state (position, current target, idle timer) that
   advances by elapsed wall-clock time every frame, purely cosmetic like the rest
   of the town view. */
const WALK_SPEED=34;
let townMotionState={};
let lastTownFrameTs=null;
function randomPointNear(anchor,radius){
  const a=Math.random()*Math.PI*2, d=Math.random()*radius;
  return {x:clamp(anchor.x+Math.cos(a)*d,24,TOWN_VIEW_SIZE-24),y:clamp(anchor.y+Math.sin(a)*d,24,TOWN_VIEW_SIZE-24)};
}
function stepTownMotion(m,home,workplace,awake,dt,now){
  if(m.state==='waiting'){
    if(m.working) m.workPhase=(m.workPhase||0)+dt*5;
    if(now>=m.waitUntil){
      const goWork=awake&&!!workplace;
      const dest=goWork?randomPointNear(workplace,16):(awake?randomPointNear(home,44):home);
      m.targetX=dest.x; m.targetY=dest.y; m.state='walking'; m.nextWorking=goWork;
    }
    return;
  }
  const dx=m.targetX-m.x, dy=m.targetY-m.y, dist=Math.hypot(dx,dy);
  if(dist<2){
    m.state='waiting';
    m.working=!!m.nextWorking; m.workPhase=0;
    m.waitUntil=now+rand(m.working?2600:700,m.working?6000:2600);
    return;
  }
  m.walkPhase=(m.walkPhase||0)+dt*9;
  const step=WALK_SPEED*dt;
  if(step>=dist){ m.x=m.targetX; m.y=m.targetY; }
  else { m.x+=dx/dist*step; m.y+=dy/dist*step; }
}
/* A few purely decorative animals per town -- farm animals grazing near
   farms, deer near forested/mountain sites -- using the same lightweight
   wander-and-wait motion pattern as citizens, but simpler (no jobs/homes). */
const TOWN_ANIMAL_KINDS={
  goat:{body:'#c9b98a',accent:'#8a7a52',legs:'#8a7a52'},
  deer:{body:'#8a6a45',accent:'#5a4028',legs:'#5a4028'}
};
let townAnimalState={_townId:null,list:[]};
function ensureTownAnimals(town){
  if(townAnimalState._townId===town.id) return townAnimalState.list;
  const list=[];
  const farms=town.buildings.filter(b=>b.type==='farm');
  const farmAnimalCount=Math.min(6,farms.length*2);
  for(let i=0;i<farmAnimalCount;i++){
    const anchor=farms.length?choice(farms):{x:TOWN_VIEW_SIZE/2,y:TOWN_VIEW_SIZE/2};
    list.push({kind:Math.random()<0.5?'goat':'chicken',anchor:{x:anchor.x,y:anchor.y},
      x:anchor.x,y:anchor.y,targetX:anchor.x,targetY:anchor.y,state:'waiting',waitUntil:0,walkPhase:0});
  }
  const g=G.grid;
  const baseTile=g?g.tiles[idx(g,town.x,town.y)]:TILE.LAND;
  if(baseTile===TILE.FOREST||baseTile===TILE.MOUNTAIN){
    for(let i=0;i<2;i++){
      const ax=rand(60,TOWN_VIEW_SIZE-60), ay=rand(60,TOWN_VIEW_SIZE-60);
      list.push({kind:'deer',anchor:{x:ax,y:ay},x:ax,y:ay,targetX:ax,targetY:ay,state:'waiting',waitUntil:0,walkPhase:0});
    }
  }
  townAnimalState={_townId:town.id,list};
  return list;
}
function stepAnimalMotion(a,dt,now){
  const speed=a.kind==='deer'?26:14;
  const radius=a.kind==='deer'?70:26;
  if(a.state==='waiting'){
    if(now>=a.waitUntil){
      const dest=randomPointNear(a.anchor,radius);
      a.targetX=dest.x; a.targetY=dest.y; a.state='walking';
    }
    return;
  }
  const dx=a.targetX-a.x, dy=a.targetY-a.y, dist=Math.hypot(dx,dy);
  if(dist<2){ a.state='waiting'; a.waitUntil=now+rand(1500,4500); return; }
  a.walkPhase=(a.walkPhase||0)+dt*7;
  const step=speed*dt;
  if(step>=dist){ a.x=a.targetX; a.y=a.targetY; } else { a.x+=dx/dist*step; a.y+=dy/dist*step; }
}
function drawAnimal(cx,cy,r,kind,walking,walkPhase){
  const bob=walking?Math.abs(Math.sin(walkPhase||0))*r*0.15:0;
  const legSwing=walking?Math.sin(walkPhase||0)*r*0.25:0;
  ctx.save();
  ctx.translate(cx,cy-bob);
  if(kind==='chicken'){
    ctx.strokeStyle='#c9622a'; ctx.lineWidth=Math.max(1,r*0.12); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-r*0.15,r*0.3); ctx.lineTo(-r*0.15+legSwing*0.3,r*0.55);
    ctx.moveTo(r*0.15,r*0.3); ctx.lineTo(r*0.15-legSwing*0.3,r*0.55);
    ctx.stroke();
    ctx.fillStyle='#f2e8d8';
    ctx.beginPath(); ctx.ellipse(0,0,r*0.55,r*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.45,-r*0.25,r*0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#d68a2a';
    ctx.beginPath(); ctx.moveTo(r*0.7,-r*0.25); ctx.lineTo(r*0.95,-r*0.2); ctx.lineTo(r*0.7,-r*0.12); ctx.closePath(); ctx.fill();
  } else {
    const c=TOWN_ANIMAL_KINDS[kind]||TOWN_ANIMAL_KINDS.goat;
    const bodyLen=kind==='deer'?r*1.1:r*0.85;
    ctx.strokeStyle=c.legs; ctx.lineWidth=Math.max(1.2,r*0.13); ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(-bodyLen*0.35,r*0.28); ctx.lineTo(-bodyLen*0.35+legSwing,r*0.28+r*0.55);
    ctx.moveTo(bodyLen*0.35,r*0.28); ctx.lineTo(bodyLen*0.35-legSwing,r*0.28+r*0.55);
    ctx.stroke();
    ctx.fillStyle=c.body;
    ctx.beginPath(); ctx.ellipse(0,0,bodyLen*0.55,r*0.42,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bodyLen*0.55,-r*0.25,r*0.28,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=c.accent; ctx.lineWidth=Math.max(1,r*0.09);
    ctx.beginPath();
    ctx.moveTo(bodyLen*0.5,-r*0.5); ctx.lineTo(bodyLen*0.42,-r*0.75);
    ctx.moveTo(bodyLen*0.62,-r*0.5); ctx.lineTo(bodyLen*0.7,-r*0.75);
    ctx.stroke();
  }
  ctx.restore();
}
/* Focus camera: tapping a citizen (or Prev/Next) smoothly zooms and centers on
   them, like tapping a pin on a map -- a clean, close, individual view of that
   one person instead of a crowd. Eases toward its target every frame so it
   never jump-cuts. Cleared whenever the town view is entered/exited. */
let townFocusId=null;
let townCam={scale:1,cx:TOWN_VIEW_SIZE/2,cy:TOWN_VIEW_SIZE/2};
const FOCUS_ZOOM=9;
function focusOnCitizen(id){ townFocusId=id; }
function clearCitizenFocus(){ townFocusId=null; }
function cycleFocus(dir){
  const town=townOf(G.viewingTownId); if(!town) return;
  const alive=town.npcIds.filter(id=>{const n=G.npcs[id]; return n&&n.alive;});
  if(!alive.length) return;
  let idx=alive.indexOf(townFocusId);
  idx=idx===-1?0:(idx+dir+alive.length)%alive.length;
  townFocusId=alive[idx];
}
function drawTownView(town){
  if(townFocusId){
    const f=G.npcs[townFocusId];
    if(!f||!f.alive||f.townId!==town.id) townFocusId=null;
  }
  const {scale,offsetX,offsetY,size}=getTownViewMetrics();
  const phase=dayPhase();
  const b=dayBrightness(phase);
  const g=G.grid;
  const baseTile=g?g.tiles[idx(g,town.x,town.y)]:TILE.LAND;
  const baseColor=TILE_COLOR[baseTile]||TILE_COLOR[TILE.LAND];
  const bright=0.45+0.55*b;
  ctx.fillStyle=`rgb(${Math.round(baseColor[0]*bright)},${Math.round(baseColor[1]*bright)},${Math.round(baseColor[2]*bright)})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(b<0.4){
    const starRng=mulberry32(1337);
    ctx.fillStyle=`rgba(255,255,255,${0.15+(0.4-b)})`;
    for(let i=0;i<70;i++){ ctx.fillRect(starRng()*canvas.width,starRng()*canvas.height*0.6,1.6,1.6); }
  }

  const npcs=town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive);
  const awake=b>0.32;
  const now=performance.now();
  const dt=lastTownFrameTs?Math.min(0.1,(now-lastTownFrameTs)/1000):0;
  lastTownFrameTs=now;

  const focusNpc=townFocusId?G.npcs[townFocusId]:null;
  let target={scale:1,cx:TOWN_VIEW_SIZE/2,cy:TOWN_VIEW_SIZE/2};
  if(focusNpc){
    let m=townMotionState[focusNpc.id];
    if(!m){
      let home=town.buildings.find(bd=>bd.id===focusNpc.homeId);
      if(!home){ ensureHome(focusNpc,town); home=town.buildings.find(bd=>bd.id===focusNpc.homeId); }
      const hx=home?home.x:TOWN_VIEW_SIZE/2, hy=home?home.y:TOWN_VIEW_SIZE/2;
      m={x:hx,y:hy,targetX:hx,targetY:hy,state:'waiting',waitUntil:0,walkPhase:0}; townMotionState[focusNpc.id]=m;
    }
    target={scale:FOCUS_ZOOM,cx:m.x,cy:m.y};
  }
  const ease=1-Math.exp(-dt*5.5);
  townCam.scale=lerp(townCam.scale,target.scale,ease);
  townCam.cx=lerp(townCam.cx,target.cx,ease);
  townCam.cy=lerp(townCam.cy,target.cy,ease);
  const camScale=scale*townCam.scale;
  const camOffsetX=canvas.width/2-townCam.cx*camScale;
  const camOffsetY=canvas.height/2-townCam.cy*camScale;

  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.fillRect(camOffsetX,camOffsetY,TOWN_VIEW_SIZE*camScale,TOWN_VIEW_SIZE*camScale);
  ctx.strokeStyle='rgba(232,196,104,0.25)'; ctx.lineWidth=2;
  ctx.strokeRect(camOffsetX,camOffsetY,TOWN_VIEW_SIZE*camScale,TOWN_VIEW_SIZE*camScale);

  const fontSize=Math.min(Math.max(10,26*camScale),30);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const bld of town.buildings){
    const bx=camOffsetX+bld.x*camScale, by=camOffsetY+bld.y*camScale;
    if(bx<-40||bx>canvas.width+40||by<-40||by>canvas.height+40) continue;
    const isTall=BUILDING_TYPES[bld.type]?.tall;
    if(isTall){
      ctx.fillStyle='rgba(0,0,0,0.22)';
      ctx.beginPath(); ctx.ellipse(bx,by+fontSize*0.4,fontSize*0.32,fontSize*0.12,0,0,Math.PI*2); ctx.fill();
    }
    ctx.font=`${isTall?fontSize*1.5:fontSize}px serif`;
    ctx.fillText(BUILDING_TYPES[bld.type]?.icon||'🏠',bx,by-(isTall?fontSize*0.35:0));
  }

  townViewScreenPos={};
  const crowded=npcs.length>150;
  const rBase=9*(1+Math.min(townCam.scale-1,4)*0.5);

  const animals=ensureTownAnimals(town);
  for(const a of animals){
    stepAnimalMotion(a,dt,now);
    const asx=camOffsetX+a.x*camScale, asy=camOffsetY+a.y*camScale;
    if(asx<-30||asx>canvas.width+30||asy<-30||asy>canvas.height+30) continue;
    drawAnimal(asx,asy,rBase*0.55,a.kind,a.state==='walking',a.walkPhase);
  }

  for(const n of npcs){
    const jailed=isImprisoned(n);
    const jail=jailed?town.buildings.find(b=>b.type==='jail'):null;
    let home=town.buildings.find(bd=>bd.id===n.homeId);
    if(!home){ ensureHome(n,town); home=town.buildings.find(bd=>bd.id===n.homeId); }
    const hx=jail?jail.x:(home?home.x:TOWN_VIEW_SIZE/2), hy=jail?jail.y:(home?home.y:TOWN_VIEW_SIZE/2);
    let m=townMotionState[n.id];
    if(!m){ m={x:hx,y:hy,targetX:hx,targetY:hy,state:'waiting',waitUntil:0,walkPhase:0}; townMotionState[n.id]=m; }
    if(!n.frozen){
      const hasJob=!jailed&&n.job&&n.job!=='laborer'&&n.job!=='unemployed';
      const workplace=hasJob?town.buildings.find(bd=>bd.id===n.workplaceId):null;
      stepTownMotion(m,{x:hx,y:hy},workplace,jailed?false:awake,dt,now);
    }
    const sx=camOffsetX+m.x*camScale, sy=camOffsetY+m.y*camScale;
    if(sx<-40||sx>canvas.width+40||sy<-40||sy>canvas.height+40) continue;
    const detailed=!crowded||n.id===townFocusId||townCam.scale>1.6;
    drawNpcDot(sx,sy,rBase,n,m.state==='walking',m.walkPhase,detailed,m.state==='waiting'&&m.working,m.workPhase,jailed);
    townViewScreenPos[n.id]={x:sx,y:sy};
  }

  const nameEl=document.getElementById('townViewName');
  const clockEl=document.getElementById('townViewClock');
  if(nameEl) nameEl.textContent=focusNpc?`${town.name} — ${focusNpc.custom?'✦ ':''}${focusNpc.name}`:`${town.name} (${npcs.length})`;
  if(clockEl) clockEl.textContent=b>0.5?'☀️ Day':'🌙 Night';
}
function enterTownView(townId){
  clearPending();
  G.viewMode='town'; G.viewingTownId=townId;
  townMotionState={}; lastTownFrameTs=null;
  townFocusId=null; townCam={scale:1,cx:TOWN_VIEW_SIZE/2,cy:TOWN_VIEW_SIZE/2};
  document.getElementById('townViewBar').style.display='flex';
  closeModal();
}
function exitTownView(){
  G.viewMode='world'; G.viewingTownId=null;
  townFocusId=null;
  document.getElementById('townViewBar').style.display='none';
}

/* ============================== MAP INPUT: PAN, ZOOM, TAP ============================== */
function handleMapTap(clientX,clientY){
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
  const cx=(clientX-rect.left)*scaleX, cy=(clientY-rect.top)*scaleY;
  if(G.viewMode==='town'){
    const town=townOf(G.viewingTownId);
    if(!town) return;
    let closest=null, closestD=24*24;
    for(const id of town.npcIds){
      const n=G.npcs[id]; if(!n||!n.alive) continue;
      const p=townViewScreenPos[n.id]; if(!p) continue;
      const d=(cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y);
      if(d<closestD){ closestD=d; closest=n; }
    }
    if(closest){ focusOnCitizen(closest.id); openNpcModal(closest); }
    return;
  }
  const {tileSize,offsetX,offsetY}=getMapMetrics();
  const tx=Math.floor((cx-offsetX)/tileSize), ty=Math.floor((cy-offsetY)/tileSize);
  if(!G.grid||!inBounds(G.grid,tx,ty)) return;
  if(G.pendingPower){ resolvePowerTarget(tx,ty); return; }
  const town=findTownAt(tx,ty);
  if(town){ openTownModal(town); return; }
  if(G.genesisStep<GENESIS_STEPS.length){ toast('The world is still void. Begin with the Genesis powers →'); }
}
function wireMapInput(){
  const activePointers=new Map();
  let dragMode=null, panStart=null, pinchStart=null;
  canvas.addEventListener('pointerdown',(e)=>{
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(activePointers.size===1){
      dragMode='pan';
      panStart={camX:camera.x,camY:camera.y,x:e.clientX,y:e.clientY,moved:false};
    } else if(activePointers.size===2){
      dragMode='pinch';
      const pts=[...activePointers.values()];
      pinchStart={dist:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),zoom:camera.zoom};
    }
  });
  canvas.addEventListener('pointermove',(e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(dragMode==='pan' && activePointers.size===1 && panStart && G.viewMode==='world'){
      const rect=canvas.getBoundingClientRect();
      const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
      const dxCss=e.clientX-panStart.x, dyCss=e.clientY-panStart.y;
      if(Math.abs(dxCss)>4||Math.abs(dyCss)>4) panStart.moved=true;
      const {tileSize}=getMapMetrics();
      camera.x=panStart.camX-(dxCss*scaleX)/tileSize;
      camera.y=panStart.camY-(dyCss*scaleY)/tileSize;
    } else if(dragMode==='pinch' && activePointers.size===2 && pinchStart && G.viewMode==='world'){
      const pts=[...activePointers.values()];
      const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      camera.zoom=clamp(pinchStart.zoom*(dist/(pinchStart.dist||1)),MIN_ZOOM,MAX_ZOOM);
    } else if(dragMode==='pan' && panStart){
      const dxCss=e.clientX-panStart.x, dyCss=e.clientY-panStart.y;
      if(Math.abs(dxCss)>4||Math.abs(dyCss)>4) panStart.moved=true;
    }
  });
  function endPointer(e){
    const wasTap=dragMode==='pan' && panStart && !panStart.moved && activePointers.size===1;
    const tapX=e.clientX, tapY=e.clientY;
    activePointers.delete(e.pointerId);
    if(wasTap) handleMapTap(tapX,tapY);
    if(activePointers.size===0){ dragMode=null; panStart=null; pinchStart=null; }
    else if(activePointers.size===1){
      const [,pos]=[...activePointers.entries()][0];
      dragMode='pan';
      panStart={camX:camera.x,camY:camera.y,x:pos.x,y:pos.y,moved:true};
    }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('wheel',(e)=>{
    if(G.viewMode!=='world') return;
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const cx=(e.clientX-rect.left)*scaleX, cy=(e.clientY-rect.top)*scaleY;
    zoomMapAt(cx,cy,e.deltaY<0?1.15:1/1.15);
  },{passive:false});
  document.getElementById('zoomIn').addEventListener('click',()=>zoomMapAt(canvas.width/2,canvas.height/2,1.35));
  document.getElementById('zoomOut').addEventListener('click',()=>zoomMapAt(canvas.width/2,canvas.height/2,1/1.35));
}

/* ============================== UI: POWERS PANEL ============================== */
function renderPowers(){
  const el=document.getElementById('panel-powers');
  let html='';
  if(G.genesisStep<GENESIS_STEPS.length){
    html+=`<div class="panelHead">Genesis</div>`;
    GENESIS_STEPS.forEach((s,i)=>{
      const done=i<G.genesisStep, current=i===G.genesisStep;
      html+=`<button class="powerBtn genesisBtn ${done?'done':''}" ${current?'':'disabled'} data-genesis="${i}">
        <span class="pIcon">${s.icon}</span>
        <span class="pName">${esc(s.label)}<span class="pSub">${done?'Complete':(current?'Ready':'Awaiting your word')}</span></span>
      </button>`;
    });
  }
  const cats=['Creation','Life','Weather','Disaster','Blessing','Civilization','Underworld'];
  for(const cat of cats){
    const list=POWERS.filter(p=>p.cat===cat);
    if(!list.length) continue;
    const anyUnlocked=list.some(isPowerUnlocked);
    if(!anyUnlocked && G.genesisStep<GENESIS_STEPS.length) continue;
    html+=`<div class="panelHead">${cat}</div>`;
    for(const p of list){
      const unlocked=isPowerUnlocked(p);
      const affordable=p.cost===0||G.favor>=p.cost;
      const selected=G.pendingPower&&G.pendingPower.def.id===p.id;
      html+=`<button class="powerBtn ${selected?'selected':''}" ${(!unlocked||!affordable)?'disabled':''} data-power="${p.id}" title="${esc(p.desc)}">
        <span class="pIcon">${p.icon}</span>
        <span class="pName">${esc(p.name)}<span class="pSub">${esc(p.desc)}</span></span>
        <span class="pCost">${p.cost>0?p.cost:''}</span>
      </button>`;
    }
  }
  el.innerHTML=html;
}

/* ============================== UI: TOWNS PANEL ============================== */
let citizenSearchQuery='';
function searchCitizens(query){
  const q=query.trim().toLowerCase();
  if(!q) return [];
  const matches=[];
  for(const t of livingTowns()){
    for(const id of t.npcIds){
      const n=G.npcs[id];
      if(n && n.alive && n.name.toLowerCase().includes(q)){ matches.push({n,t}); if(matches.length>=40) return matches; }
    }
  }
  return matches;
}
function renderTowns(){
  const el=document.getElementById('panel-towns');
  /* The search input lives in its own container, created once and never
     rebuilt afterward -- otherwise every background event (a birth, a
     death, a tech advance) calling markDirty('towns') would blow away
     the input's focus and cursor position mid-keystroke. Only the results
     area below it gets refreshed on every render. */
  if(!el.querySelector('#citizenSearchInput')){
    el.innerHTML=`<div class="searchBar"><input id="citizenSearchInput" type="text" placeholder="🔍 Search citizens by name..." value="${esc(citizenSearchQuery)}"/></div><div id="townsListArea"></div>`;
  }
  renderTownsListArea();
}
function renderTownsListArea(){
  const listEl=document.getElementById('townsListArea');
  if(!listEl) return;
  const towns=livingTowns();
  let searchHtml='';
  if(citizenSearchQuery.trim()){
    const matches=searchCitizens(citizenSearchQuery);
    searchHtml=`<div class="panelHead">Search Results (${matches.length})</div><div class="npcList">`+

  if(!towns.length){ listEl.innerHTML=searchHtml+'<div class="emptyState">No peoples walk the world yet.</div>'; return; }
  listEl.innerHTML=searchHtml+`<div class="panelHead">Peoples of the World</div>`+towns.map(t=>{

    return `

/* Debug/admin readout -- live world stats for the Console tab. Skipped
   whenever the console tab isn't the visible one (offsetParent is null
   for a display:none ancestor), so it costs nothing while hidden. */
function renderDebugPanel(){
  const dp=document.getElementById('debugPanel');
  if(!dp||!dp.offsetParent) return;
  const towns=livingTowns();
  const totalPop=towns.reduce((s,t)=>s+t.population,0);
  const aliveTracked=towns.reduce((s,t)=>s+t.npcIds.length,0);
  let ageSum=0,ageN=0;
  for(const t of towns) for(const id of t.npcIds){ const p=G.npcs[id]; if(p&&p.alive){ ageSum+=p.age; ageN++; } }
  const avgAge=ageN?(ageSum/ageN).toFixed(1):'0';
  dp.innerHTML=`
    <div class="dpHead">World</div>
    <span>Day</span><b>${G.tickCount}</b>
    <span>Era</span><b>${esc(ERAS[G.era]||'?')}</b>
    <span>Speed</span><b>${G.paused?'Paused':(G.speedMult+'x')}</b>
    <span>Favor</span><b>${Math.round(G.favor)}</b>
    <div class="dpHead">Population</div>
    <span>Countries</span><b>${towns.length}/${MAX_TOWNS}</b>
    <span>Total pop</span><b>${totalPop}</b>
    <span>Tracked NPCs</span><b>${aliveTracked}</b>
    <span>Avg tracked age</span><b>${avgAge}</b>
    <div class="dpHead">Lifetime</div>
    <span>Total births</span><b>${G.stats.totalBirths}</b>
    <span>Total deaths</span><b>${G.stats.totalDeaths}</b>
    <span>Prayers answered</span><b>${G.stats.totalPrayersAnswered}</b>
    <span>Prayers denied</span><b>${G.stats.totalPrayersDenied}</b>
  `;
}

let createHumanState=null;
const AGE_BANDS={newborn:0,child:10,youngAdult:20,adult:35,elder:65};
const AGE_BAND_LABELS={newborn:'Newborn',child:'Child',youngAdult:'Young Adult',adult:'Adult',elder:'Elder'};
function openCreateHumanModal(){

}
function renderCreateHumanModal(){
  const s=createHumanState;
  const towns=livingTowns();
  if(!towns.find(t=>t.id===s.townId)) s.townId=towns[0].id;
  openModal(`
    <button class="modalClose" data-close="1">×</button>
    <h2>Create a Human</h2>
    <div class="mSub">Shape one soul by hand — name, likeness, and gifts of your choosing. Their portrait is a generated likeness, not a photograph.</div>
    <div style="display:flex;gap:16px;align-items:center;margin:10px 0">
      <div class="modalPortrait">${portraitSVG(s.appearance,88)}</div>
      <div style="flex:1">
        <input id="chName" class="chField" type="text" value="${esc(s.name)}" placeholder="Name" style="margin-bottom:6px"/>
        <button id="chRandomName" style="background:var(--panel2);border:1px solid var(--gold-dim);color:var(--gold);border-radius:6px;padding:5px 10px;font-size:11px">🎲 Random Name</button>
      </div>
    </div>
    <div class="panelHead">Settlement</div>
    <select id="chTown" class="chField">
      ${towns.map(t=>`<option value="${t.id}" ${t.id===s.townId?'selected':''}>${esc(t.name)}</option>`).join('')}
    </select>
    <div class="panelHead">Sex</div>
    <div class="actionRow">
      <button data-chsex="f" class="${s.sex==='f'?'selected':''}">Female</button>
      <button data-chsex="m" class="${s.sex==='m'?'selected':''}">Male</button>
    </div>
    <div class="panelHead">Age</div>

    </div>
    <div class="panelHead">Skin Tone</div>
    <div class="swatchRow">${SKIN_TONES.map((c,i)=>`<div class="swatch ${s.appearance.skin===i?'sel':''}" data-swatch="skin" data-i="${i}" style="background:${c}"></div>`).join('')}</div>
    <div class="panelHead">Hair Color</div>
    <div class="swatchRow">${HAIR_COLORS.map((c,i)=>`<div class="swatch ${s.appearance.hairColor===i?'sel':''}" data-swatch="hairColor" data-i="${i}" style="background:${c}"></div>`).join('')}</div>
    <div class="panelHead">Eye Color</div>
    <div class="swatchRow">${EYE_COLORS.map((c,i)=>`<div class="swatch ${s.appearance.eyeColor===i?'sel':''}" data-swatch="eyeColor" data-i="${i}" style="background:${c}"></div>`).join('')}</div>
    <div class="panelHead">Hair Style</div>
    <div class="actionRow">
      ${Object.keys(HAIR_STYLES).map(k=>`<button data-chhair="${k}" class="${s.appearance.hairStyle===k?'selected':''}">${esc(k)}</button>`).join('')}
    </div>
    <div class="panelHead">Traits (choose up to 2)</div>
    <div class="actionRow">
      ${TRAIT_POOL.map(t=>`<button data-chtrait="${esc(t)}" class="${s.traits.includes(t)?'selected':''}">${esc(t)}</button>`).join('')}
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--text-dim)">
      <input type="checkbox" id="chExceptional" ${s.exceptional?'checked':''}/> Grant exceptional talent (Gifted)
    </label>
    <div class="actionRow">
      <button id="chSubmit" style="background:var(--gold);color:#241a00;font-weight:700">✨ Breathe Life Into Them (20)</button>
    </div>
  `);
  wireCreateHumanModal();
}
function wireCreateHumanModal(){
  const box=document.getElementById('modalBox');
  document.getElementById('chName').addEventListener('input',(e)=>{ createHumanState.name=e.target.value; });
  document.getElementById('chRandomName').addEventListener('click',(e)=>{
    e.preventDefault(); createHumanState.name=choice(FIRST_NAMES); renderCreateHumanModal();
  });
  document.getElementById('chTown').addEventListener('change',(e)=>{ createHumanState.townId=e.target.value; });
  document.getElementById('chExceptional').addEventListener('change',(e)=>{ createHumanState.exceptional=e.target.checked; });
  box.querySelectorAll('[data-chsex]').forEach(b=>b.addEventListener('click',(e)=>{
    e.preventDefault(); createHumanState.sex=b.dataset.chsex; renderCreateHumanModal();
  }));
  box.querySelectorAll('[data-chage]').forEach(b=>b.addEventListener('click',(e)=>{
    e.preventDefault(); createHumanState.ageBand=b.dataset.chage; renderCreateHumanModal();
  }));
  box.querySelectorAll('[data-swatch]').forEach(el=>el.addEventListener('click',()=>{
    createHumanState.appearance[el.dataset.swatch]=Number(el.dataset.i); renderCreateHumanModal();
  }));
  box.querySelectorAll('[data-chhair]').forEach(b=>b.addEventListener('click',(e)=>{
    e.preventDefault(); createHumanState.appearance.hairStyle=b.dataset.chhair; renderCreateHumanModal();
  }));
  box.querySelectorAll('[data-chtrait]').forEach(b=>b.addEventListener('click',(e)=>{
    e.preventDefault();
    const t=b.dataset.chtrait;
    const idx=createHumanState.traits.indexOf(t);
    if(idx!==-1) createHumanState.traits.splice(idx,1);
    else if(createHumanState.traits.length<2) createHumanState.traits.push(t);
    renderCreateHumanModal();
  }));
  document.getElementById('chSubmit').addEventListener('click',(e)=>{ e.preventDefault(); submitCreateHuman(); });
}
function submitCreateHuman(){
  const cost=POWER_BY_ID.createHuman.cost;
  if(G.favor<cost){ toast('Not enough favor.'); return; }
  const s=createHumanState;
  const town=townOf(s.townId);
  if(!town){ toast('Choose a settlement.'); return; }
  const name=(s.name||'').trim()||choice(FIRST_NAMES);
  G.favor-=cost;
  const age=AGE_BANDS[s.ageBand];
  const n=makeNpc({age,townId:town.id,techStageIdx:town.techStageIdx,appearance:{...s.appearance},
    sex:s.sex,name,traits:s.traits,custom:true});
  if(s.exceptional){
    n.giftedAtBirth=true; n.talent=clamp(n.talent+50,0,100);
    if(!n.traits.includes('Gifted')) n.traits.push('Gifted');
  }
  addNpcToTown(town,n);
  town.population++;
  recordDivine(town,'blessing');
  log(`You shape ${n.name} by hand and set them among the people of ${town.name}.`,'milestone');
  createHumanState=null;
  markDirty('towns'); markDirty('header');
  openNpcModal(n);
}

  if(G.dirty.prayers){ renderPrayers(); G.dirty.prayers=false; }
  if(G.dirty.specimen){ renderSpecimen(); G.dirty.specimen=false; }
  if(G.dirty.towns){ renderTowns(); populateEraJump(); G.dirty.towns=false; }
}

function initUI(){
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('mobileToggle').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.toggle('mobileOpen');
  });

  document.getElementById('speedBtns').addEventListener('click',(e)=>{
    const btn=e.target.closest('button'); if(!btn) return;
    const sp=btn.dataset.speed;
    if(sp==='pause'){ G.paused=!G.paused; }
    else { G.paused=false; G.speedMult=Number(sp); }
    renderHeader();
  });
  document.getElementById('eraJump').addEventListener('change',(e)=>{
    const val=e.target.value;
    if(!val) return;
    fastForwardToEra(Number(val));
    e.target.value='';
  });
  document.getElementById('cancelTarget').addEventListener('click',clearPending);
  document.getElementById('resetWorldBtn').addEventListener('click',()=>{
    if(confirm('Wipe this world and start a brand new one? This cannot be undone.')) resetWorld();
  });
  const consoleInput=document.getElementById('consoleInput');
  document.getElementById('consoleRun').addEventListener('click',()=>{
    runConsoleCommand(consoleInput.value); consoleInput.value='';
  });
  consoleInput.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ runConsoleCommand(consoleInput.value); consoleInput.value=''; }
  });
  document.getElementById('chronHead').addEventListener('click',()=>{
    const f=document.getElementById('chronicle');
    f.classList.toggle('collapsed');
    document.getElementById('chronToggle').textContent=f.classList.contains('collapsed')?'▸':'▾';
  });
  document.getElementById('chronLog').addEventListener('scroll',(e)=>{
    const el=e.target;
    chronAutoScroll = (el.scrollHeight-el.scrollTop-el.clientHeight)<30;
  });

  document.getElementById('panel-powers').addEventListener('click',(e)=>{
    const g=e.target.closest('[data-genesis]');
    if(g){ doGenesisStep(Number(g.dataset.genesis)); return; }
    const p=e.target.closest('[data-power]');
    if(p){ selectPower(p.dataset.power); return; }
  });
  document.getElementById('panel-prayers').addEventListener('click',(e)=>{
    const a=e.target.closest('[data-answer]'); if(a){ answerPrayer(a.dataset.answer); return; }
    const d=e.target.closest('[data-deny]'); if(d){ denyPrayer(d.dataset.deny); return; }
  });
  document.getElementById('panel-towns').addEventListener('click',(e)=>{
    const npcRow=e.target.closest('[data-npc]'); if(npcRow){ const n=G.npcs[npcRow.dataset.npc]; if(n) openNpcModal(n); return; }
    const c=e.target.closest('[data-town]'); if(!c) return;
    const town=townOf(c.dataset.town); if(town) openTownModal(town);
  });
  document.getElementById('panel-towns').addEventListener('input',(e)=>{
    if(e.target.id==='citizenSearchInput'){ citizenSearchQuery=e.target.value; renderTownsListArea(); }
  });

  document.getElementById('modalRoot').addEventListener('click',(e)=>{
    if(e.target.id==='modalRoot' && !document.getElementById('modalRoot')._blockClose){ closeModal(); return; }
    const close=e.target.closest('[data-close]');
    if(close){ if(!document.getElementById('modalRoot')._blockClose){ closeModal(); } return; }
    const enterTown=e.target.closest('[data-enter-town]');
    if(enterTown){ enterTownView(enterTown.dataset.enterTown); return; }
    const townAct=e.target.closest('[data-townact]');
    if(townAct){
      const town=townOf(townAct.dataset.town);
      const p=POWER_BY_ID[townAct.dataset.townact];
      if(town&&p){
        if(G.favor<p.cost){ toast('Not enough favor.'); return; }
        G.favor-=p.cost; applyTownPower(p,town); openTownModal(town); renderDirty();
      }
      return;
    }
    const npcRow=e.target.closest('[data-npc]:not([data-npcact])');
    if(npcRow && !e.target.closest('[data-npcact]')){
      const n=G.npcs[npcRow.dataset.npc]; if(n) openNpcModal(n);
      return;
    }
    const npcAct=e.target.closest('[data-npcact]');
    if(npcAct){
      const n=G.npcs[npcAct.dataset.npc];
      const p=POWER_BY_ID[npcAct.dataset.npcact];
      if(n&&p){
        if(G.favor<p.cost){ toast('Not enough favor.'); return; }
        G.favor-=p.cost;
        const ok=applyNpcPower(p,n);
        if(ok===false){ G.favor+=p.cost; }
        else openNpcModal(n);
        renderDirty();
      }
      return;
    }
    const applyBtn=e.target.closest('[data-applynpc]');
    if(applyBtn && G.pendingPower){
      const n=G.npcs[applyBtn.dataset.applynpc];
      const p=G.pendingPower.def;
      if(n && p.id==='grantPower'){
        clearPending();
        openGrantPowerModal(n.id);
        return;
      }
      if(n&&G.favor>=p.cost){
        G.favor-=p.cost;
        const ok=applyNpcPower(p,n);
        if(ok===false) G.favor+=p.cost;
        clearPending();
        openNpcModal(n);
        renderDirty();
      }
      return;
    }
    const grantPowerBtn=e.target.closest('[data-grantpower]');
    if(grantPowerBtn){ openGrantPowerModal(grantPowerBtn.dataset.grantpower); return; }
    const grantBtn=e.target.closest('[data-grant]');
    if(grantBtn){
      const n=G.npcs[grantBtn.dataset.npc];
      const cost=POWER_BY_ID.grantPower.cost;
      if(n && G.favor>=cost && !n.grantedPowers.includes(grantBtn.dataset.grant)){
        G.favor-=cost;
        n.grantedPowers.push(grantBtn.dataset.grant);
        log(`${n.name} is granted the power of ${POWER_BY_ID[grantBtn.dataset.grant].name}.`,'milestone');
        recordDivine(townOf(n.townId),'blessing');
        openNpcModal(n);
        renderDirty();
      } else if(!n||G.favor<cost){
        toast('Not enough favor.');
      }
      return;
    }
    const raiseBtn=e.target.closest('[data-raise]');
    if(raiseBtn){
      const soul=G.souls.hell.find(s=>s.id===raiseBtn.dataset.raise);
      if(soul){ raiseDemon(soul); openUnderworldModal(); renderDirty(); }
      return;
    }
  });

  wireMapInput();
  document.getElementById('backToWorld').addEventListener('click',exitTownView);
  document.getElementById('focusNext').addEventListener('click',()=>cycleFocus(1));
  document.getElementById('focusPrev').addEventListener('click',()=>cycleFocus(-1));
  document.getElementById('focusClear').addEventListener('click',clearCitizenFocus);
  window.addEventListener('resize',resizeCanvas);
}

/* ============================== TIME / SAVE ============================== */
function tickDuration(){ return 1200/(G.speedMult||1); }
function fastForwardToEra(targetEra){
  if(targetEra<=G.era){ toast('Already there or beyond.'); return; }
  if(G._mutationModalOpen){ closeModal(); G._mutationModalOpen=false; }
  FAST_FORWARDING=true;
  let iterations=0;
  while(G.era<targetEra && iterations<20000){
    simulateTick();
    autoAdvanceIfStuck(true);
    iterations++;
  }
  FAST_FORWARDING=false;
  log(`Time leaps forward to the ${ERAS[G.era]}.`,'time');
  renderAll();
}
const SAVE_KEY='demiurge_save_v2';
let isResetting=false;
function saveGame(){
  if(isResetting) return;
  try{
    const copy=Object.assign({},G);
    delete copy.dirty; delete copy._mutationModalOpen;
    localStorage.setItem(SAVE_KEY,JSON.stringify(copy));
    localStorage.setItem(SAVE_KEY+'_time',String(Date.now()));
    const ind=document.getElementById('saveInd');
    ind.classList.add('show'); clearTimeout(saveGame._t);
    saveGame._t=setTimeout(()=>ind.classList.remove('show'),1200);
  }catch(err){ console.warn('save failed',err); }
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    return raw?JSON.parse(raw):null;
  }catch(err){ return null; }
}
function doOfflineCatchup(lastReal){
  const elapsedMs=Date.now()-lastReal;
  if(elapsedMs<60000) return;
  const ticks=Math.min(Math.floor(elapsedMs/tickDuration()),1500);
  if(ticks<=0) return;
  if(G._mutationModalOpen){ G._mutationModalOpen=false; }
  FAST_FORWARDING=true;
  const b0=G.stats.totalBirths, d0=G.stats.totalDeaths;
  for(let i=0;i<ticks;i++){ simulateTick(); autoAdvanceIfStuck(false); }
  FAST_FORWARDING=false;
  showOfflineSummary({ticks,births:G.stats.totalBirths-b0,deaths:G.stats.totalDeaths-d0});
}

/* ============================== GAME LOOP ============================== */
let lastFrame=0, tickAccum=0;
let lastDebugRender=0;
function gameLoop(ts){
  const dt=Math.min(ts-lastFrame,1000); lastFrame=ts;
  if(!G.paused){
    tickAccum+=dt;
    const interval=tickDuration();
    let guard=0;
    while(tickAccum>interval && guard<50){ tickAccum-=interval; simulateTick(); guard++; }
  }
  renderCanvas();
  renderDirty();
  if(ts-lastDebugRender>500){ renderDebugPanel(); lastDebugRender=ts; }
  requestAnimationFrame(gameLoop);
}

/* ============================== DIVINE CONSOLE ==============================
   Direct, unrestricted access to the live game state. This is a single-player,
   fully offline sandbox -- no server, no other player, nothing to protect
   against -- so the console lets you do literally anything to your own world,
   the same way any other god power does. */
function findNpcByName(name){
  const q=String(name).toLowerCase();
  return Object.values(G.npcs).find(n=>n.alive&&n.name.toLowerCase()===q);
}
function freeze(name){
  const n=findNpcByName(name);
  if(!n) return `No living person named "${name}" found.`;
  n.frozen=!n.frozen;
  markDirty('towns');
  return n.frozen?`${n.name} is now frozen in time.`:`${n.name} thaws.`;
}
function freezeTime(){
  doFreezeTime();
  return G.paused?'Time is frozen.':'Time flows again.';
}
function kill(name,cause){
  const n=findNpcByName(name);
  if(!n) return `No living person named "${name}" found.`;
  killNpc(n,townOf(n.townId),cause||"a god's hand");
  markDirty('towns');
  return `${n.name} has died.`;
}
function bless(name){ const n=findNpcByName(name); if(!n) return 'Not found.'; applyNpcPower(POWER_BY_ID.bless,n); return `${n.name} blessed.`; }
function curse(name){ const n=findNpcByName(name); if(!n) return 'Not found.'; applyNpcPower(POWER_BY_ID.curse,n); return `${n.name} cursed.`; }
function spawnHuman(name,townIndex){
  const town=G.towns[townIndex||0];
  if(!town) return 'No settlement exists yet.';
  const n=makeNpc({age:20,townId:town.id,techStageIdx:town.techStageIdx,name:name||undefined,custom:true});
  addNpcToTown(town,n);
  town.population++;
  markDirty('towns');
  return `${n.name} now walks among the people of ${town.name}.`;
}
function listTowns(){
  if(!G.towns.length) return 'No settlements yet.';
  return G.towns.map((t,i)=>`[${i}] ${t.name} — pop ${t.population}, ${TECH_STAGES[t.techStageIdx]}`).join('\n');
}
function listPeople(townIndex){
  const town=G.towns[townIndex||0];
  if(!town) return 'No settlement at that index.';
  return town.npcIds.map(id=>G.npcs[id]).filter(n=>n&&n.alive).map(n=>`${n.name} (${n.status}, ${n.job})`).join('\n')||'No tracked citizens.';
}
function setEra(name){
  const i=ERAS.findIndex(e=>e.toLowerCase()===String(name).toLowerCase());
  if(i===-1) return 'Unknown era. Try one of: '+ERAS.join(', ');
  fastForwardToEra(i);
  return `Leapt to ${ERAS[i]}.`;
}
function help(){
  return [
    'Direct access: G is the entire live game state -- read or write anything.',
    '  G.favor = 999',
    '  G.towns[0].gold = 5000',
    '  G.towns[0].unrest = 0',
    '',
    'Shortcuts:',
    '  freeze("Name")          toggle a person frozen in time',
    '  freezeTime()            pause/resume the whole world',
    '  bless("Name") / curse("Name")',
    '  kill("Name")',
    '  spawnHuman("Name", townIndex)',
    '  listTowns()  /  listPeople(townIndex)',
    '  setEra("Modern Age")    jump straight to an era',
    '',
    'Anything else you type runs as plain JavaScript against the live game.'
  ].join('\n');
}
function appendConsoleLine(text,cls){
  const el=document.getElementById('consoleOutput');
  if(!el) return;
  const div=document.createElement('div');
  div.className='cLine '+(cls||'cInfo');
  div.textContent=text;
  el.appendChild(div);
  while(el.children.length>300) el.removeChild(el.firstChild);
  el.scrollTop=el.scrollHeight;
}
function formatConsoleResult(v){
  if(typeof v==='string') return v;
  if(v===null||v===undefined) return String(v);
  try{ return JSON.stringify(v,(k,val)=>typeof val==='function'?'[fn]':val,1).slice(0,3000); }
  catch(e){ return String(v); }
}
function runConsoleCommand(raw){
  const code=raw.trim();
  if(!code) return;
  appendConsoleLine('> '+code,'cCmd');
  try{
    const result=eval(code);
    if(result!==undefined) appendConsoleLine(formatConsoleResult(result),'cResult');
    renderDirty(); renderCanvas();
  }catch(err){
    appendConsoleLine('Error: '+err.message,'cError');
  }
}

/* ============================== BOOT ============================== */
function boot(){
  const saved=loadGame();
  if(saved){
    G=saved;
    G.dirty={powers:true,prayers:true,specimen:true,towns:true,header:true};
    G._mutationModalOpen=false;
    G.viewMode='world'; G.viewingTownId=null;
    if(!G.grid) G.grid=buildGrid(60,36,G.seed);
    G.caravans=G.caravans||[];
    G.towns.forEach(t=>{
      t.buildings=t.buildings||[];
      if(t.materials===undefined) t.materials=0;
      if(t.materialsCap===undefined) t.materialsCap=200;
      if(t.goods===undefined) t.goods=0;
      if(t.goodsCap===undefined) t.goodsCap=150;
      if(t.gini===undefined) t.gini=0.3;
    });
    Object.values(G.npcs).forEach(n=>{
      if(n.job===undefined) n.job='unemployed';
      if(n.workplaceId===undefined) n.workplaceId=null;
      if(n.wealth===undefined) n.wealth=irand(5,25);
      if(n.curiosityBaseline===undefined){
        n.curiosityBaseline=clamp(rand(25,55)+(n.traits&&n.traits.includes('Curious')?18:0),3,97);
        n.curiosity=n.curiosityBaseline;
      }
      if(n.frozen===undefined) n.frozen=false;
      if(n.grantedPowers===undefined) n.grantedPowers=[];
    });
    if(G.offlineProgress){
      const lastReal=Number(localStorage.getItem(SAVE_KEY+'_time'))||Date.now();
      doOfflineCatchup(lastReal);
    }
  } else {
    G=initNewGame();
    G.grid=buildGrid(60,36,G.seed);
  }
  resetCamera();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  initUI();
  resizeCanvas();
  document.querySelectorAll('#chronLog div').length; // no-op
  (G.chronicle||[]).slice(-60).forEach(entry=>appendChronicleDOM(entry.text,entry.cat));
  renderAll();
  requestAnimationFrame(gameLoop);
  setInterval(saveGame,15000);
  window.addEventListener('beforeunload',saveGame);
  if(G.genesisStep===0 && G.towns.length===0) showWelcomeModal();
}
function resetWorld(){
  isResetting=true;
  localStorage.removeItem(SAVE_KEY);
  localStorage.removeItem(SAVE_KEY+'_time');
  location.reload();
}
function showWelcomeModal(){
  openModal(`
    <button class="modalClose" data-close="1">×</button>
    <h2>You Are Demiurge</h2>
    <div class="mSub">A god awakening before an empty void.</div>
    <div class="statRow" style="display:block;line-height:1.6">
      Everything you can do lives in the <b style="color:var(--gold)">Powers</b> panel on the right.
      Start with <b style="color:var(--gold)">Genesis</b> at the top of that list — click through Light,
      Matter, Waters, Land, Vegetation, and finally "It Is Good" to shape the world.
    </div>
    <div class="statRow" style="display:block;line-height:1.6;margin-top:10px">
      Once life awakens and grows into humans, settlements will appear on the map. Click one to
      inspect it, bless or curse its people, and answer their prayers as they come in.
    </div>
    <div class="actionRow">
      <button data-close="1" style="background:var(--gold);color:#241a00;font-weight:700">Begin Creation</button>
    </div>
  `);
}
boot();
</script>
